function drawTerminal(L,top,cx,cy){
  const x=top?L.x2:L.x1, y=top?L.y2:L.y1;
  const X=Math.round(x-cx), Y=Math.round(y-cy); if(Y<-40 || Y>VH+40 || X<-60 || X>VW+60) return;
  if(top && !onMountain(x,y)) return;
  if(top && !L.to) txt(L.name.toUpperCase(), X+4, Y+4, '#3b6fc1', 8, 'center', false);
  if(!top){ ctx.fillStyle='rgba(40,110,220,0.45)'; ctx.fillRect(X-10, Y+4, 28, 20);          // blue loading zone
    ctx.fillStyle='#ffd23f'; ctx.fillRect(X-10, Y+23, 28, 1); ctx.fillRect(X-10, Y+4, 28, 1);
    txt(L.name.toUpperCase(), X+4, Y+27, L.to?'#c8402f':'#3b6fc1', 8, 'center', false);
    if(L.to){ ctx.fillStyle='#5a3b24'; ctx.fillRect(X-22, Y-30, 2, 26); ctx.fillRect(X+28, Y-30, 2, 26);       // big red sign
      ctx.fillStyle='#c8402f'; ctx.fillRect(X-26, Y-44, 60, 16); ctx.fillStyle='#ffffff'; ctx.fillRect(X-26, Y-44, 60, 1);
      txt('P2P', X+4, Y-40, '#ffffff', 8, 'center', false); } }
  ctx.fillStyle='#e9eef5'; ctx.fillRect(X-9, Y-17, 26, 3);
  ctx.fillStyle='#5b6470'; ctx.fillRect(X-8, Y-14, 24, 9);
  ctx.fillStyle='#2f343b'; ctx.fillRect(X-8, Y-6, 24, 1); ctx.fillRect(X+3, Y-5, 2, 5);

function drawLifts(cx,cy){
  for(const L of LIFTS){ drawTerminal(L,false,cx,cy); drawTerminal(L,true,cx,cy); }
  if(P.state==='tbar' && P.lift){                                    // your rope down from the cable, bar under your butt
    const hx=Math.round(P.tbHX+0-cx), hy=Math.round(P.tbHY-16-cy), rx=Math.round(P.x-cx), ry=Math.round(P.y-6-cy);
    ctx.strokeStyle='#6a5a48'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(hx+0.5,hy+0.5); ctx.lineTo(rx+0.5,ry+0.5); ctx.stroke();
    ctx.fillStyle='#8b6a44'; ctx.fillRect(rx-3,ry,7,1); }
  for(const L of LIFTS){ if(Math.max(L.y1,L.y2)<cy-20 || Math.min(L.y1,L.y2)>cy+VH+20) continue;
    const dx=L.dx, dy=L.dy, len=L.len;
    for(const side of [-4,4]){
      ctx.strokeStyle='#4a4f58'; ctx.lineWidth=1; ctx.beginPath();
      ctx.moveTo(L.x1+side-cx+0.5, L.y1-16-cy+0.5); ctx.lineTo(L.x2+side-cx+0.5, L.y2-16-cy+0.5); ctx.stroke();
      const gap=L.tbar?45:L.gondola?70:50, off=(game.t*(L.tbar?CFG.TBAR_SPEED:25))%gap;
      for(let d=off; d<len; d+=gap){ const t=side>0 ? d/len : 1-d/len;
        const x=Math.round(L.x1+dx*t+side-cx), y=Math.round(L.y1+dy*t-16-cy); if(y<-12||y>VH+12||x<-8||x>VW+8) continue;
        ctx.fillStyle='#333';
        if(L.tbar){ if(side>0 && P.state==='tbar' && P.lift===L && Math.abs(L.y1+dy*t-P.tbHY)<14) continue;
          ctx.fillStyle='#6a5a48'; ctx.fillRect(x,y,1,8); ctx.fillStyle='#8b6a44'; ctx.fillRect(x-2,y+8,5,1); continue; }
        if(L.gondola){ ctx.fillRect(x,y,1,2); ctx.fillStyle='#c8402f'; ctx.fillRect(x-2,y+2,5,6);
          ctx.fillStyle='#bfe3ff'; ctx.fillRect(x-1,y+3,3,2); ctx.fillStyle='#8e2a1f'; ctx.fillRect(x-2,y+7,5,1); }
        else { ctx.fillRect(x,y,1,3); ctx.fillRect(x-1,y+3,3,2); } } } }
}

function drawGear(cx,cy){
  for(const g of P.gear){
    const C=CHARS[game.char], len=g.type==='ski'?9:g.type==='board'?11:g.type==='mitt'?1:6;
    const col=g.type==='ski'||g.type==='board'?C.gear:g.type==='mitt'?C.jacket:'#8a8a8a', c=Math.cos(g.rot), s=Math.sin(g.rot)*0.6;
    const bx=g.x-cx, by=g.y-cy-g.z;
    if(g.z>0){ ctx.fillStyle='rgba(60,80,110,0.3)'; ctx.fillRect(Math.round(g.x-cx-3),Math.round(g.y-cy),6,1); }
    ctx.fillStyle=col;
    for(let t=-len/2;t<=len/2;t++) ctx.fillRect(Math.round(bx+c*t), Math.round(by+s*t), g.type==='board'?2:1, g.type==='board'?2:1);
  }
}

// Draw a rider (skier or snowboarder) with feet at (sx,by). ang = travel angle, up<0 = upside down.
function drawRider(C,sx,by,ang,up,o){
  const dx=Math.sin(ang), dy=Math.cos(ang)*0.6, pxp=Math.cos(ang), pyp=-Math.sin(ang)*0.6;
  const feet=by-(1-up)*5, skis=C.type==='ski' || o.skins || o.skinAnim>0;   // a splitboard becomes skis to climb
  const plank=(off,len,col)=>{ ctx.fillStyle=col; for(let t=-len;t<=len;t++) ctx.fillRect(Math.round(sx+dx*t+pxp*off), Math.round(feet+dy*t+pyp*off), 1, 1); };
  if(skis){ plank(-1.5,4,C.gear); plank(1.5,4,C.gear);
    if(o.skins){ plank(-1.5,3,'#e8553b'); plank(1.5,3,'#e8553b'); } }
  const ba=ang+(o.skidDir||1)*Math.PI/2*(o.skid||0), bx=Math.sin(ba), byy=Math.cos(ba)*0.8;   // board angle: along your direction, across it when stopping
  if(!skis){                                                         // one wide board
    const qx=Math.cos(ba), qy=-Math.sin(ba)*0.6;
    for(const off of [-1,0,1]) for(let t=-7;t<=7;t++){ if(Math.abs(off)===1 && Math.abs(t)>=7) continue;
      ctx.fillStyle=Math.abs(t)>=6?'#e8eef5':C.gear;
      ctx.fillRect(Math.round(sx+bx*t+qx*off), Math.round(feet+byy*t+qy*off), 1, 1); } }
  if(o.skinAnim>0){ ctx.fillStyle='#e8553b';                       // skins flapping in the wind
    for(const side of [-1,1]) for(let k=0;k<10;k++)
      ctx.fillRect(Math.round(sx+side*(3+k)), Math.round(by-8+Math.sin(game.t*18+k*0.9)*(1+k*0.3)), 1, 2); }
  const legH=o.low?2:3, torH=o.low?3:4;
  const part=(off,h,w,col)=>{ const a=feet-up*(off+h), b=feet-up*off; ctx.fillStyle=col;
    ctx.fillRect(sx-(w>>1), Math.round(Math.min(a,b)), w, Math.max(1,Math.round(Math.abs(a-b)))); };
  if(skis){ part(0,legH,3,C.pants); part(legH,torH,5,C.jacket); }
  else {                                                             // boarder: sideways stance - front and back foot along the board
    for(const f of [-2.5,2.5]){ const lx=Math.round(sx+bx*f), ly=feet+byy*f, a=ly-up*legH;
      ctx.fillStyle=C.pants; ctx.fillRect(lx-1, Math.round(Math.min(a,ly)), 2, Math.max(1,Math.round(Math.abs(a-ly)))); }
    part(legH,torH,3,C.jacket);
    const ay=feet-up*(legH+torH-1); ctx.fillStyle=C.jacket;          // arms out along the board, like a rider sideways to the hill
    ctx.fillRect(Math.round(sx+bx*4)-1, Math.round(ay+byy*4), 2, 1); ctx.fillRect(Math.round(sx-bx*4)-1, Math.round(ay-byy*4), 2, 1); }
  part(legH+torH,3,3,C.helmet); part(legH+torH+1,1,3,C.goggles);
  if(!o.low && o.poles && skis){ ctx.fillStyle='#888'; ctx.fillRect(sx-4,feet-5,1,5); ctx.fillRect(sx+4,feet-5,1,5); }
  if(o.grab){ ctx.fillStyle=C.jacket; ctx.fillRect(Math.round(sx+dx*3), Math.round(feet+dy*3-up), 2, 2); }
}
function drawSkier(cx,cy){
  const C=CHARS[game.char];
  const sx=Math.round(P.x-cx), sy=Math.round(P.y-cy);
  if(P.state==='cat'){ drawCat(sx,sy,P.catH,true); return; }
  if(P.state==='lift'){
    if(P.lift.gondola){ ctx.fillStyle='#333'; ctx.fillRect(sx,sy-18,1,3);                     // you, inside a cabin
      ctx.fillStyle='#c8402f'; ctx.fillRect(sx-4,sy-15,9,11); ctx.fillStyle='#bfe3ff'; ctx.fillRect(sx-3,sy-13,7,4);
      ctx.fillStyle=C.jacket; ctx.fillRect(sx-1,sy-12,3,3); ctx.fillStyle=C.helmet; ctx.fillRect(sx-1,sy-13,3,1);
      ctx.fillStyle='#8e2a1f'; ctx.fillRect(sx-4,sy-5,9,1); return; }
    ctx.fillStyle='#333'; ctx.fillRect(sx+3,sy-16,1,7); ctx.fillRect(sx-3,sy-9,8,2); }
  else { const sh=Math.max(0.35,1-P.z/160);
    ctx.fillStyle='rgba(60,80,110,0.35)'; ctx.fillRect(Math.round(sx-4*sh), sy, Math.round(8*sh), 2); }
  if(P.state==='crash' && game.heli && game.heli.pos && game.heli.pos.lifted) return;   // you're in the stretcher now
  if(P.state==='crash'){
    if(!P.yard){ ctx.fillStyle=C.gear;
      if(C.type==='ski') for(let t=-4;t<=4;t++){ ctx.fillRect(sx+t,sy+(t>>1),1,1); ctx.fillRect(sx+t,sy-(t>>1),1,1); }
      else for(let t=-5;t<=5;t++) ctx.fillRect(sx+t,sy+1,1,2); }
    ctx.fillStyle=C.jacket; ctx.fillRect(sx-3,sy-2,6,2); ctx.fillStyle=C.pants; ctx.fillRect(sx+3,sy-2,3,2);
    ctx.fillStyle=C.helmet; ctx.fillRect(sx-6,sy-3,3,3); return; }
  if(P.inv>0 && Math.floor(P.inv*12)%2) return;                // blink after a crash
  const by=sy-Math.round(P.z)-pipeLift(), air=P.state==='air' && !P.minor;
  const skidOff = C.type==='ski' || P.skins ? (P.h<-0.08?-1:P.h>0.08?1:(P.skidSide||1))*(P.skid||0)*Math.PI*0.45 : 0;   // skid = sideways stop, turning further across the hill
  const ang = P.state==='air' ? Math.atan2(P.vx,P.vy)+P.spin : P.h+skidOff;
  if(P.wing && (P.state==='ride' || P.state==='air')) drawWing(sx, by);
  drawRider(C, sx, by, ang, air?Math.cos(P.flip):1,
    { low:P.tuck||!!P.grab, poles:P.state==='ride', grab:!!P.grab, skins:P.skins, skinAnim:P.skinAnim, skid:P.skid,
      skidDir: P.h<-0.08 ? -1 : P.h>0.08 ? 1 : (P.skidSide||1) });
}

// paraglider canopy: a curved, striped wing on lines above you; loops swing it right round
function drawWing(x,y){
  const st=(keys.right?1:0)-(keys.left?1:0), up=P.state==='air', a=(up?P.flip:0)+st*0.22, lo=!up && P.v<60;
  ctx.save(); ctx.translate(x,y-6); ctx.rotate(a);
  const top=lo?-18:-30, cols=['#ffd23f','#e0402a','#2f6fd6'];
  ctx.strokeStyle='rgba(40,40,55,0.55)'; ctx.lineWidth=0.6; ctx.beginPath();
  for(const lx of [-17,-9,0,9,17]){ ctx.moveTo(0,0); ctx.lineTo(lx, top+2+lx*lx*0.02); } ctx.stroke();
  for(let i=-9;i<=9;i++){ const cxp=Math.round(i*2), cyp=Math.round(top+i*i*0.09);
    ctx.fillStyle=cols[Math.floor((i+9)/3)%3]; ctx.fillRect(cxp-1,cyp-3,2,4);
    ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.fillRect(cxp-1,cyp-3,2,1); ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(cxp-1,cyp,2,1); }
  ctx.restore();
}
// character select screen

  CHARS.forEach((c,i)=>{

    drawRider(c, 0, 0, Math.PI/2 + (sel ? Math.sin(game.t*2)*0.4 : 0), 1, { low:false, poles:true });   // side-on so the skis/board show

function locName(){
  if(P.state==='lift' && P.lift) return { n:P.lift.name.toUpperCase(), g:null };
  if(P.state==='cat') return { n:'SNOWCAT', g:null };
  if(P.state==='tbar' && P.lift) return { n:P.lift.name.toUpperCase(), g:null };
  if(P.state==='skintrack') return { n:'SKIN TRACK', g:null };
  if(WORLD.bc){ if(P.y<WORLD.bc.rockTop) return { n:'CHAM SUMMIT', g:null };
    const c=chuteAt(P.x,P.y); if(c && P.y<WORLD.bc.rockTo) return { n:c.name, g:'black' }; }
  const r=runAt(P.x,P.y);
  if(r){ const pk=PARKS.find(q=>q.run===r.id && P.y>q.y1 && P.y<q.y2); if(pk) return { n:pk.name.toUpperCase(), g:'park' };
    return { n:r.name.toUpperCase(), g:r.grade }; }
  if(P.y<700) return { n:WORLD.bc?'CHAM SUMMIT':WORLD.jp?'ニセコアンヌプリ山頂':(WORLD.id==='whistler'?'WHISTLER':'BLACKCOMB')+' PEAK', g:null };
  const z=zoneAt(P.x,P.y); if(z) return { n:z.name.toUpperCase(), g:z.type==='glade'?'black':null };
  if(WORLD.jp) return { n: P.y<WORLD.treeline ? '高山帯' : P.y<WORLD.forest ? '森林限界' : '白樺の森', g:null };   // alpine / treeline / birch forest
  return { n: P.y<WORLD.treeline ? 'ALPINE' : P.y<WORLD.forest ? 'TREELINE' : 'IN THE TREES', g:null };
}

function drawFlight(){

  ctx.fillStyle=sky; ctx.fillRect(0,0,VW,hz);
  const sunX=Math.round(VW*(dir<0?0.3:0.7));

  const sea=ctx.createLinearGradient(0,hz,0,VH); sea.addColorStop(0,'#6a5a8a'); sea.addColorStop(1,'#1e2a4a');

    ctx.fillRect(Math.round(sunX-w/2+Math.sin(t*2+i*1.7)*4), Math.round(yy), Math.round(w), 1); }

    if(pressed.left) game.char=(game.char+CHARS.length-1)%CHARS.length;
    if(pressed.right) game.char=(game.char+1)%CHARS.length;
    if(pressed.enter){ try{ localStorage.setItem('kdawRider', game.char); }catch(e){} newRun(WORLD.id==='whistler'?START:TELE); }
  }
  else if(game.mode==='finish' && pressed.enter) newRun(WORLD.id==='whistler'?START:TELE);
  else if(game.mode==='play' || game.mode==='pause'){
    if(pressed.pause) game.mode = game.mode==='play' ? 'pause' : 'play';
    if(pressed.reset) newRun(START);
    if(pressed.tele){ if(WORLD.id!=='whistler') switchMap('whistler'); newRun(TELE); }
    if(pressed.secret){ P.packs.bc=true; travel('backcountry', DEFS.backcountry.start, 'CHAM SUMMIT'); }   // secret test key: straight to the top of the backcountry
    if(pressed.bctele){ if(WORLD.id!=='blackcomb') switchMap('blackcomb'); newRun(TELE); }
    if(pressed.char && game.mode==='pause') game.mode='select';
    if(pressed.niseko){ if(WORLD.id==='niseko') newRun(TELE);
      else { game.mode='travel'; game.travelMsg='HEADING TO NISEKO, JAPAN...';                       // build Niseko behind the loading screen
        setTimeout(()=>{ switchMap('niseko'); newRun(TELE); popup('ようこそ ニセコへ', 0, '#ffd6a0', true); }, 60); } }
    if(pressed.p2p){ const L=LIFTS.find(l=>l.to); if(L){ const sc=game.score; newRun({ x:L.x1+4, y:L.y1+14 }); game.score=sc; boardLift(L); } }
  }
  if(TOUCH){ const pm=document.getElementById('pm'), want=game.mode==='pause'?'flex':'none'; if(pm.style.display!==want) pm.style.display=want;
    const mm=game.mode==='play'||game.mode==='pause'; if(mm!==game.lastPlayView){ game.lastPlayView=mm; fit(); }
    document.body.classList.toggle('noplay', game.mode!=='play'); }          // hide the ski buttons on the title, rider and menu screens
  const s0=game.score; update(dt);
  if(WORLD.bc && WORLD.bc.double && game.mode!=='select' && game.score>s0) game.score+=game.score-s0;   // backcountry: every point counts double
  for(const k in pressed) pressed[k]=false;
  ctx.imageSmoothingEnabled=false;
  render();
  requestAnimationFrame(frame);
}
// show a loading screen, then build Whistler (Blackcomb is built when you first ride the Peak 2 Peak)
ctx.fillStyle='#1b2333'; ctx.fillRect(0,0,VW,VH); txt('LOADING THE MOUNTAIN...', VW/2, 145, '#ffffff', 8, 'center');
setTimeout(()=>{
  MAPS.whistler=buildMap(DEFS.whistler); useMap(MAPS.whistler);
  resetSkier(START); const t=camTarget(); cam.x=t.x; cam.y=t.y;
  requestAnimationFrame(frame);
}, 30);
</script>
