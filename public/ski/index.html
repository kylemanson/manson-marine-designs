  .tb.act { width:74px; height:74px; flex-direction:column; font-size:20px; line-height:1; }

  .tb.left  { left:calc(14px + env(safe-area-inset-left)); bottom:calc(20px + env(safe-area-inset-bottom)); }

  .tb.stop  { right:calc(12px + env(safe-area-inset-right)); bottom:calc(18px + env(safe-area-inset-bottom)); }
  .tb.jump  { right:calc(98px + env(safe-area-inset-right)); bottom:calc(18px + env(safe-area-inset-bottom)); }

<body>
<canvas id="c" width="400" height="300"></canvas>
<div class="tc" id="tc">
  <button class="tb big left"  data-k="left"  aria-label="Steer left">&#9664;</button>
  <button class="tb big right" data-k="right" aria-label="Steer right">&#9654;</button>
  <button class="tb act tuck"  data-k="up" aria-label="Tuck">&#9650;<small>TUCK</small></button>
  <button class="tb act stop"  data-k="down" aria-label="Stop">&#9660;<small>STOP</small></button>
  <button class="tb jump"      data-k="jump">JUMP</button>
  <button class="tb grab"      data-k="g1">GRAB</button>
  <button class="tb sm menu"   data-k="pause" aria-label="Menu">MENU</button>
  <button class="tb sm mapb"   data-k="map">MAP</button>
  <button class="tb sm fsb" id="fsb" aria-label="Full screen">FULL</button>
  <button class="tb sm wingb" data-k="wing">WING</button>
</div>
<div class="pm" id="pm">
  <h2>PAUSED</h2>
  <button data-tap="pause">KEEP SKIING</button>
  <button data-tap="reset">RESTART AT THE PEAK</button>
  <button data-tap="tele">WHISTLER ROUNDHOUSE</button>
  <button data-tap="bctele">BLACKCOMB MID-STATION</button>
  <button data-tap="p2p">PEAK 2 PEAK GONDOLA</button>
  <button data-tap="niseko">START AT NISEKO, JAPAN</button>
  <button data-tap="char">CHANGE RIDER</button>
  <button data-tap="mute">SOUND ON / OFF</button>
  <button data-tap="full" id="pmfull">FULL SCREEN</button>
</div>

// ---------- 3. HELPERS ----------
const clamp = (v,a,b) => v<a?a:v>b?b:v;
function wrapPi(a){ a=(a+Math.PI)%(2*Math.PI); if(a<0)a+=2*Math.PI; return a-Math.PI; }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash(x,y){ let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;
  h=Math.imul(h^(h>>>13),1274126177); return (h^(h>>>16))>>>0; }
function distSeg(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, l=dx*dx+dy*dy;
  let t=l?((px-ax)*dx+(py-ay)*dy)/l:0; t=clamp(t,0,1);
  const ex=ax+t*dx-px, ey=ay+t*dy-py; return Math.sqrt(ex*ex+ey*ey); }
function vnoise(x,y){          // smooth value noise 0..1
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi, r=(a,b)=>(hash(a,b)&1023)/1023, sm=t=>t*t*(3-2*t);
  const a=r(xi,yi), b=r(xi+1,yi), c=r(xi,yi+1), d=r(xi+1,yi+1), u=sm(xf), v=sm(yf);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function interp(arr,u){ const f=clamp(u,0,1)*(arr.length-1), i=Math.min(arr.length-2,Math.floor(f)), t=f-i,
  s=(1-Math.cos(t*Math.PI))/2; return arr[i]*(1-s)+arr[i+1]*s; }

// ---- the current map's data and generated world (swapped by useMap) ----
let WORLD, PEAK, START, TELE, OUTLINE, BASES, RUNS, ZONES, MOGULS, CLIFFS, RIDGES, ALPINE, PILLOW_LINES,
    GLADE_CLIFFS, FOREST_PILLOW_LINES, PARKS, JUMPS, LIFTS, BUILDINGS, LABELS, RANGE, CLOUDS, BANKS;
let CATPTS=[], CATBOX=null, STEPUPS=[];
function catBox(){ let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const p of CATPTS){ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]); }
  CATBOX=CATPTS.length?[x0-20,x1+20,y0-20,y1+20]:null; }                      // the cat track while a map is being built (trees and cliffs keep off it)
let NB, buckets, KICKERS, BOXES, TOWERS, RIDGE_CLIFFS, SH, MM, CREST, GROOMED, PONDS=[], rng, lineId=0;
const BUCKET = 50, CRATER_Y = 112;
function snapshot(){ return { STEPUPS, WORLD, PEAK, START, TELE, OUTLINE, BASES, RUNS, ZONES, MOGULS, CLIFFS, RIDGES, ALPINE, PILLOW_LINES,
  GLADE_CLIFFS, FOREST_PILLOW_LINES, PARKS, JUMPS, LIFTS, BUILDINGS, LABELS, RANGE, CLOUDS, BANKS,
  NB, buckets, KICKERS, BOXES, TOWERS, RIDGE_CLIFFS, SH, MM, CREST, GROOMED, PONDS }; }
function useMap(m){ ({ STEPUPS, WORLD, PEAK, START, TELE, OUTLINE, BASES, RUNS, ZONES, MOGULS, CLIFFS, RIDGES, ALPINE, PILLOW_LINES,
  GLADE_CLIFFS, FOREST_PILLOW_LINES, PARKS, JUMPS, LIFTS, BUILDINGS, LABELS, RANGE, CLOUDS, BANKS,
  NB, buckets, KICKERS, BOXES, TOWERS, RIDGE_CLIFFS, SH, MM, CREST, GROOMED, PONDS } = m); }

// half-width of the mountain at height y (the triangle outline)
function halfW(y){
  const o=OUTLINE; if(y<o[0][0]) return -1;
  for(let i=0;i<o.length-1;i++){ const a=o[i], b=o[i+1]; if(y<=b[0]) return a[1]+(b[1]-a[1])*(y-a[0])/(b[0]-a[0]); }
  return o[o.length-1][1];
}
function onMountain(x,y){ return Math.abs(x-PEAK.x) < halfW(y) && (!WORLD.bc || y>skyY(x)); }
function inEll(z,x,y){ const a=(x-z.x)/z.rx, b=(y-z.y)/z.ry; return a*a+b*b<1; }
function zoneAt(x,y,type){ for(const z of ZONES) if((!type||z.type===type) && inEll(z,x,y)) return z; return null; }

// Distance from (x,y) to a run's EDGE: negative = on the run. Also records which
// sample/side of the run is nearest in Q (used for the snow banks).
const Q = { s:0, side:0, i:0 };
function runQ(r,x,y){
  const b=r.B[Math.floor(y/BUCKET)]; if(!b) return 1e9;
  const S=r.S; let best=1e9, bi=-1, bc=0;
  for(const i of b){ const a=S[i], c=S[i+1]; if(Math.abs(x-a.x)>140) continue;
    const dx=c.x-a.x, dy=c.y-a.y, l=dx*dx+dy*dy; let t=l?((x-a.x)*dx+(y-a.y)*dy)/l:0; t=t<0?0:t>1?1:t;
    const ex=a.x+t*dx-x, ey=a.y+t*dy-y, e=Math.sqrt(ex*ex+ey*ey)-(a.hw+(c.hw-a.hw)*t);
    if(e<best){ best=e; bi=i; bc=dx*(y-a.y)-dy*(x-a.x); } }
  if(bi>=0){ Q.i=bi; Q.side=bc>0?0:1; Q.s=S[bi].s; }
  return best;
}
const E = { e:1e9, r:null, i:0, side:0 };       // nearest run edge over all runs
function edgeAt(x,y){ E.e=1e9; E.r=null;
  for(const r of RUNS){ const e=runQ(r,x,y); if(e<E.e){ E.e=e; E.r=r; E.i=Q.i; E.side=Q.side; } }
  return E.e; }
function bankAt(){ return E.r ? E.r.S[E.i].bank[E.side] : 0; }
function runAt(x,y){ let best=null, be=0; for(const r of RUNS){ const e=runQ(r,x,y); if(e<be){ be=e; best=r; } } return best; }

// ---- backcountry: rock everywhere up top except the three Cham Chutes ----
function prepChutes(){
  const B=WORLD.bc; B.n=Math.ceil((B.rockTo+40-B.rockTop)/4)+1;
  if(!B.peaks){ B.peaks=[[1000,30]];                                   // lots of little summits along the skyline
    for(let x=520;x<=1480;x+=28+rng()*30){ if(Math.abs(x-1000)<30) continue; B.peaks.push([x, 44+Math.abs(x-1000)*0.24+rng()*100]); } }
  const fz=(c,y)=>{ const k=c.f; if(y<=k[0][0]) return k[0][1];
    for(let j=0;j<k.length-1;j++) if(y<=k[j+1][0]) return k[j][1]+(k[j+1][1]-k[j][1])*(y-k[j][0])/(k[j+1][0]-k[j][0]); return k[k.length-1][1]; };
  if(B.glacier && !B.glacier.glacier){ B.glacier.glacier=true; B.chutes.push(B.glacier); }
  B.chutes.forEach((c,k)=>{ c.xs=[]; c.hws=[];
    for(let i=0;i<B.n;i++){ const y=B.rockTop+i*4, hw=Math.max(60,halfW(y));
      const g=0.4+0.6*clamp((y-420)/700,0,1), bd=1000-0.33*hw*g;            // boundary between the rocky third and the glacier
      if(c.glacier){ const l=bd+12, r=1000+0.93*hw; c.xs.push((l+r)/2+10*Math.sin(y/260)); c.hws.push((r-l)/2+6*vnoise(y/200,9.1)); continue; }   // the glacier: two thirds of the face
      if(y<c.y0-2 || y>c.y1){ c.xs.push(NaN); c.hws.push(0); continue; }
      const f=fz(c,y), open=clamp((y-(c.y1-450))/450,0,1);
      c.xs.push(bd-(bd-(1000-hw))*f+8*Math.sin(y/210+k*2));                                                          // chutes: the rocky left third
      c.hws.push((c.extreme?0.8:1)*(12+17*vnoise(y/150,k*3.1+1)+6*(y/B.rockTo)) + open*(c.opens?55:14)
                 + (c.extreme?16*clamp(1-(y-c.y0-90)/300,0,1):0)); } });                                             // room to land below the entry drop
}
function skyY(x){ const B=WORLD.bc; if(!B || !B.peaks) return -1e9; let m=1e9;      // the jagged summit skyline
  for(const p of B.peaks) m=Math.min(m, p[1]+Math.abs(x-p[0])*1.7); return m+9*vnoise(x/9,2.2); }
function rockEnd(x){ const B=WORLD.bc; return B.rockTo-70*vnoise(x/110,7.3)-420*clamp((600-x)/80,0,1); }   // ragged bottom of the rock band; the left side opens up early
function chuteAt(x,y){ const B=WORLD.bc; if(!B || y<B.rockTop || y>B.rockTo+40) return null; const i=Math.round((y-B.rockTop)/4);
  for(const c of B.chutes) if(Math.abs(x-c.xs[i])<c.hws[i]) return c; return null; }
function rockAt(x,y){ const B=WORLD.bc; if(!B) return false; const e=rockEnd(x);
  if(y>e+60) return false;
  if(y>e-80 && vnoise(x/22,y/22)<(y-(e-80))/140) return false;            // the rock band breaks up into outcrops and boulders at its base
  return (y>B.rockTop+12*vnoise(x/50,3) || Math.abs(x-PEAK.x)>95) && !chuteAt(x,y); }
function nearChute(x,y){ const B=WORLD.bc, i=clamp(Math.round((y-B.rockTop)/4),0,B.n-1); let best=null, bd=1e9;
  for(const c of B.chutes){ if(!(c.hws[i]>0)) continue; const d=Math.abs(x-c.xs[i])-c.hws[i]; if(d<bd){ bd=d; best=[c,c.xs[i],c.hws[i]]; } } return best; }
function slopeAt(x,y){
  if(WORLD.bc){ const B=WORLD.bc;                              // the backcountry is steep, the chutes are steeper
    if(y<B.rockTop) return 0.45;
    if(y<B.rockTo){ const c=chuteAt(x,y); return c && c.glacier ? 0.85 : 1.3; }
    if(y<WORLD.treeline) return 1.0+0.12*vnoise(x/300,y/400); }
  if(y<250) return 0.5;                                        // summit
  if(y>WORLD.village) return 0.12;                             // runout to the base
  const f=zoneAt(x,y,'flat'); if(f) return f.slope||0.22;      // lodge flats
  const r=runAt(x,y); if(r && r.slope) return r.slope;
  if(y<WORLD.treeline){                                        // alpine
    for(const c of RIDGE_CLIFFS) if(x>c.x1 && x<c.x2){         // steep rollovers below the ridges
      const b=lipY(c,x)+cliffH(c,x); if(y>b && y<b+180) return 1.0; }
    return 0.72 + 0.12*vnoise(x/300,y/400);
  }
  if(y<WORLD.forest) return 0.62 + 0.1*vnoise(x/300,y/400);   // treeline
  return 0.56 + 0.1*Math.sin(y/520) + 0.05*Math.sin(y/170 + x/300);
}

// ---------- 4. WORLD BUILD ----------
function addObj(o){ const i=Math.floor(o.y/BUCKET); if(i>=0 && i<NB) buckets[i].push(o); }

// ---- runs: sample each centre line, give it a natural varying width and snow banks ----
function bankAmt(r,s,side){                       // 0 = no bank .. 1 = big bank
  if(s<80 || s>r.len-80) return 0;
  const n=vnoise(s/BANKS.scale + r.seed*3.1 + side*57, 4.2+side);
  if(r.fun) return 0.5+0.5*n;                     // fun runs: big banks all the way
  return clamp(n*1.9-0.55, 0, 1);
}
function prepRuns(){
  GROOMED=new Path2D();
  RUNS.forEach((r,ri)=>{
    r.seed=ri*13.7+1; const S=[]; let s=0;
    for(let i=0;i<r.pts.length-1;i++){ const a=r.pts[i], b=r.pts[i+1], L=Math.hypot(b[0]-a[0],b[1]-a[1]), n=Math.max(1,Math.ceil(L/8));
      for(let k=0;k<n;k++){ const t=k/n; S.push({ x:a[0]+(b[0]-a[0])*t, y:a[1]+(b[1]-a[1])*t, s:s+L*t }); } s+=L; }
    const last=r.pts[r.pts.length-1]; S.push({ x:last[0], y:last[1], s });
    r.len=s; r.S=S;
    for(const p of S){
      let hw = r.fixed ? r.w/2 : r.w/2*(0.75+0.5*vnoise(p.s/260+r.seed, 1.7));      // natural width changes
      if(PARKS.some(pk=>pk.run===r.id && p.y>pk.y1-100 && p.y<pk.y2+100) ||
         LIFTS.some(L=>Math.hypot(L.x1-p.x,L.y1-p.y)<80 || Math.hypot(L.x2-p.x,L.y2-p.y)<80)) hw=Math.max(hw,r.w/2);
      p.hw=hw; p.bank=r.nobank ? [0,0] : [bankAmt(r,p.s,0), bankAmt(r,p.s,1)];
    }
    r.B=Array.from({length:NB},()=>[]);
    for(let i=0;i<S.length-1;i++){ const y0=Math.min(S[i].y,S[i+1].y)-130, y1=Math.max(S[i].y,S[i+1].y)+130;
      for(let bi=Math.max(0,Math.floor(y0/BUCKET)); bi<=Math.min(NB-1,Math.floor(y1/BUCKET)); bi++) r.B[bi].push(i); }
    const Lp=[], Rp=[];                           // outline for drawing the groomed surface
    for(let i=0;i<S.length;i++){ const a=S[Math.max(0,i-1)], c=S[Math.min(S.length-1,i+1)], dx=c.x-a.x, dy=c.y-a.y, L=Math.hypot(dx,dy)||1, p=S[i];
      Lp.push([p.x-dy/L*p.hw, p.y+dx/L*p.hw]); Rp.push([p.x+dy/L*p.hw, p.y-dx/L*p.hw]); }
    const pts=Lp.concat(Rp.reverse()); GROOMED.moveTo(pts[0][0],pts[0][1]); for(const q of pts) GROOMED.lineTo(q[0],q[1]); GROOMED.closePath();
  });
}

// ---- cliffs ----
function shapeCliff(c){           // irregular profile: a big drop, smaller steps, maybe a gap, a wavy lip
  if(c.pillow || c.prof) return;
  const K=Math.max(3,Math.round((c.x2-c.x1)/22));
  c.prof=[]; c.lip=[];
  for(let i=0;i<=K;i++){ c.prof.push(0.15+0.7*rng()); c.lip.push((rng()-0.5)*18); }
  c.prof[1+((rng()*(K-1))|0)]=1;
  if(rng()<0.45 && !c.cornice) c.prof[((rng()*(K+1))|0)]=0.02;
}
function cliffH(c,x){
  const half=(c.x2-c.x1)/2, u=(x-(c.x1+half))/half; if(Math.abs(u)>=1) return 0;
  if(c.pillow) return c.h*Math.max(0.3,Math.sqrt(1-u*u));
  if(c.fence) return c.h;                                 // snow gate: a straight steel fence
  const j=0.92+0.16*((hash(Math.floor(x/4),c.y|0)&255)/255);
  const env=Math.pow(1-u*u, c.ridge?0.15:0.35);
  const h=c.h*interp(c.prof,(x-c.x1)/(c.x2-c.x1))*env*j;
  return h<6 ? 0 : h;                                     // tiny = just snow (a steep rollover), no drop
}
function lipY(c,x){
  if(c.pillow) return c.y;
  const u=(x-c.x1)/(c.x2-c.x1), base=c.ridge ? c.ya+(c.yb-c.ya)*clamp(u,0,1) : c.y;
  return base+interp(c.lip,u);
}
function nearCliff(x,y){
  for(const c of CLIFFS){ const pad=c.pillow?3:8; if(x>c.x1-pad && x<c.x2+pad){
    const ly=lipY(c,clamp(x,c.x1,c.x2)); if(c.pillow ? (y>ly-12 && y<ly+c.h+26) : (y>ly-28 && y<ly+c.h+90)) return true; } }
  return false;
}
function cliffOK(x1,x2,y,h,line){
  if(WORLD.bc && y<WORLD.bc.rockTo+40) return false;
  if(WORLD.road) for(const xx of [x1,(x1+x2)/2,x2]){ const ry=WORLD.road.ry[clamp(xx|0,0,WORLD.w)]; if(y-30<ry+16 && y+h+40>ry-50) return false; }   // keep the road clear
  for(const c of CLIFFS){ if(line && c.line===line) continue;
    if(x2<c.x1-20 || x1>c.x2+20) continue;
    if(c.ridge){ for(const xx of [x1,(x1+x2)/2,x2]){ const ly=lipY(c,clamp(xx,c.x1,c.x2));
        if(y+h+70>ly-30 && y-30<ly+c.h+90) return false; } }
    else if(y+h+70>c.y-28 && y-28<c.y+c.h+70) return false;
  }
  for(const yy of [y, y+h+40]) if(Math.abs(x1-PEAK.x)>halfW(yy)-24 || Math.abs(x2-PEAK.x)>halfW(yy)-24) return false;   // stay on the mountain
  for(const m of MOGULS) if(m.rect && x2>m.rect[0]-20 && x1<m.rect[2]+20 && y+h+60>m.rect[1] && y-30<m.rect[3]) return false;
  for(const q of PONDS) if(x2>q.x-q.rx-30 && x1<q.x+q.rx+30 && y+h+40>q.y-q.ry-20 && y-30<q.y+q.ry+20) return false;
  for(const p of CATPTS) if(p[0]>x1-28 && p[0]<x2+28 && p[1]>y-36 && p[1]<y+h+70) return false;
  for(const r of RUNS) for(const xx of [x1,(x1+x2)/2,x2]) for(const yy of [y-10,y+h/2,y+h+40])
    if(runQ(r,xx,yy)<12) return false;
  for(const L of LIFTS){
    for(let xx=x1; xx<=x2+0.1; xx+=15) for(const yy of [y,y+h/2,y+h]) if(distSeg(xx,yy,L.x1,L.y1,L.x2,L.y2)<16) return false;
    for(const [tx,ty] of [[L.x1,L.y1],[L.x2,L.y2]]) if(x2>tx-40 && x1<tx+40 && y+h+40>ty-30 && y-30<ty+60) return false; }
  for(const k of KICKERS) if(Math.abs(k.x-(x1+x2)/2)<(x2-x1)/2+k.w/2+20 && Math.abs(k.y-y)<h+80) return false;
  for(const b of BUILDINGS) if(Math.abs(b.x-(x1+x2)/2)<(x2-x1)/2+b.w/2+20 && (Math.abs(b.y-y)<h+80 || (b.curry && y<b.y && y+h>b.y-200))) return false;
  if(Math.hypot((x1+x2)/2-START.x, y-START.y)<80 || Math.hypot((x1+x2)/2-TELE.x, y-TELE.y)<60) return false;
  return true;
}
// A pillow line: rows of snow-capped stumps and boulders stepping down the slope.
// Each row has 1-3 pillows side by side; rows overlap so you drop from one pillow onto the next.
function addPillowLine(x,y,n,zone){
  const id=++lineId; let px=x, py=y, added=0, W=50+rng()*50;
  for(let row=0; row<n; row++){
    const cnt=1+(rng()*3|0); let rowH=0;
    for(let k=0;k<cnt;k++){
      const w=24+rng()*36, h=16+rng()*24;
      const qx=px+(cnt===1?0:(k/(cnt-1)-0.5)*W)+(rng()-0.5)*14, qy=py+(rng()-0.5)*8;
      const inZone=!zone || (inEll(zone,qx-w/2,qy) && inEll(zone,qx+w/2,qy) && inEll(zone,qx,qy+h+20));
      if(inZone && cliffOK(qx-w/2,qx+w/2,qy,h,id)){ CLIFFS.push(qy>=WORLD.treeline ? { x1:qx-w/2, x2:qx+w/2, y:qy, h, pillow:true, line:id, seed:rng() }   // pillows only at treeline and below
        : { x1:qx-w/2, x2:qx+w/2, y:qy, h:Math.max(16,Math.round(h*0.75)), line:id }); added++; rowH=Math.max(rowH,h); }
    }
    if(rowH && rng()<0.5){                                       // a small tree nestled beside the pillows - tap it on the way down
      const sd=rng()<0.5?-1:1, tx=px+sd*(W/2+12+rng()*10), ty=py+rowH*0.55;
      if(onMountain(tx,ty) && edgeAt(tx,ty)>4) addObj({ t:'tree', x:tx, y:ty, r:4, s:rng()<0.6?1:0 }); }
    py += (rowH||24)*0.9+4+rng()*10; px += (rng()-0.5)*40; W=clamp(W+(rng()-0.5)*30, 40, 110);
  }
  return added;
}
// tall multi-step cliffs: big rock bands stacked down the hill with small shelves between
function addStack(x,y,n){
  const id=++lineId; let px=x, py=y, added=0;
  for(let i=0;i<n;i++){ const w=90+rng()*90, h=90+rng()*110;
    if(cliffOK(px-w/2,px+w/2,py,h,id)){ CLIFFS.push({ x1:px-w/2, x2:px+w/2, y:py, h, line:id }); added++; }
    py += h+30+rng()*40; px += (rng()-0.5)*60; }
  return added;
}
function randOnMtn(margin, y0, y1){              // random spot on the mountain between y0 and y1
  if(WORLD.bc){ y0=Math.max(y0, WORLD.bc.rockTo+60); y1=Math.max(y1, y0+200); }      // nothing generated in the rock band
  const y=y0+rng()*(y1-y0), hw=Math.max(0,halfW(y)-margin);
  return [PEAK.x+(rng()*2-1)*hw, y];
}
function blocked(x,y){
  if(nearCliff(x,y)) return true;
  for(const k of KICKERS) if(Math.abs(x-k.x)<k.w/2+14 && y>k.y-k.len-30 && y<k.y+60) return true;
  for(const b of BOXES) if(Math.abs(x-b.x)<14 && y>b.y-30 && y<b.y+b.len+30) return true;
  for(const b of BUILDINGS) if(Math.abs(x-b.x)<b.w/2+10 && y>b.y-b.h-10 && y<b.y+14) return true;
  for(const L of LIFTS){ if(distSeg(x,y,L.x1,L.y1,L.x2,L.y2)<10) return true;
    if(Math.abs(x-L.x1)<26 && y>L.y1-20 && y<L.y1+40) return true;
    if(Math.abs(x-L.x2)<26 && y>L.y2-20 && y<L.y2+50) return true; }
  for(const m of MOGULS) if(m.rect && x>m.rect[0] && x<m.rect[2] && y>m.rect[1] && y<m.rect[3]) return true;
  for(const q of PONDS){ if(q.rect){ if(Math.abs(x-q.x)<q.rx+14 && Math.abs(y-q.y)<q.ry+14) return true; continue; }
    const a=(x-q.x)/(q.rx+12), b=(y-q.y)/(q.ry+10); if(a*a+b*b<1) return true; }
  if(Math.hypot(x-START.x,y-START.y)<40 || Math.hypot(x-TELE.x,y-TELE.y)<30) return true;
  return false;
}

// Build everything for one map definition, and return it as a map object.

  WORLD=d.world; WORLD.id=d.id; WORLD.name=d.name; PEAK=d.peak; START=d.start; TELE=d.tele; OUTLINE=d.outline; BASES=d.bases;
  RUNS=d.runs; ZONES=d.zones; MOGULS=d.moguls; CLIFFS=d.cliffs; RIDGES=d.ridges; ALPINE=d.alpine; PILLOW_LINES=d.pillowLines;
  GLADE_CLIFFS=d.gladeCliffs; FOREST_PILLOW_LINES=d.forestPillowLines; PARKS=d.parks; JUMPS=d.jumps; LIFTS=d.lifts;
  BUILDINGS=d.buildings; LABELS=d.labels; RANGE=d.range; CLOUDS=d.clouds; BANKS=d.banks; PONDS=d.ponds||[];

  if(WORLD.air){ const a=WORLD.air; BUILDINGS.push({ name:'airport', x:a.x-14, y:a.y+66, w:70, h:28, c:'#d9dde3', airport:true }); }   // little terminal and tower
  rng=mulberry32(d.seed);
  if(WORLD.bc) prepChutes();
  if(WORLD.bc){ const B=WORLD.bc, at=(c,y)=>{ const i=clamp(Math.round((y-B.rockTop)/4),0,B.n-1); return [c.xs[i],c.hws[i]]; };
    for(const c of B.chutes){ if(c.glacier) continue;
      if(c.extreme){ const [cx,hw]=at(c,c.y0+14); CLIFFS.push({ x1:cx-hw-10, x2:cx+hw+10, y:c.y0+4, h:90, line:9000 }); }   // the only way in is a cliff drop
      let y=c.y0+(c.extreme?250:100); const N=c.extreme?5:3;
      for(let k=0;k<N;k++){ y+=320+rng()*380; if(y>c.y1-250) break; const [cx,hw]=at(c,y), h=30+rng()*(c.extreme?80:55);
        const full=rng()<0.45, left=rng()<0.5, x1=full||left ? cx-hw-6 : cx-hw*0.15, x2=full||!left ? cx+hw+6 : cx+hw*0.15;
        CLIFFS.push({ x1, x2, y, h, line:9001+k }); } } }
  NB=Math.ceil(WORLD.h/BUCKET)+4; buckets=Array.from({length:NB},()=>[]);
  KICKERS=[]; BOXES=[]; TOWERS=[]; RIDGE_CLIFFS=[]; CATPTS=[]; CATBOX=null; STEPUPS=[];
  for(const L of LIFTS){ L.dx=L.x2-L.x1; L.dy=L.y2-L.y1; L.len=Math.hypot(L.dx,L.dy); }
  prepRuns();
  const clear=[...(d.clears||[])];                // areas kept free of trees (Big Air arena, pond skim)
  WORLD.road=null; WORLD.cars=null;
  if(d.road){ const R=d.road, W=WORLD.w|0, ry=new Float32Array(W+1), tun=new Uint8Array(W+1), p=R.pts;   // the winding road, as height y for every x
    for(let x=0,i=0;x<=W;x++){ while(i<p.length-2 && x>p[i+1][0]) i++; const a=p[i], b=p[i+1]; ry[x]=a[1]+(b[1]-a[1])*clamp((x-a[0])/(b[0]-a[0]),0,1); }
    for(let pass=0;pass<3;pass++){ const c=ry.slice(); for(let x=0;x<=W;x++){ let sm=0,n=0; for(let k=-40;k<=40;k+=4){ const j=clamp(x+k,0,W); sm+=c[j]; n++; } ry[x]=sm/n; } }
    let x0=W, x1=0; for(let x=0;x<=W;x++) if(onMountain(x,ry[x]) && Math.abs(x-PEAK.x)<halfW(ry[x])-6){ x0=Math.min(x0,x); x1=Math.max(x1,x); }
    for(let x=0;x<=W;x++) tun[x]= x<x0||x>x1 ? 2 : edgeAt(x,ry[x])<6 ? 1 : 0;          // 1 = under a run (tunnel), 2 = off the mountain
    for(let x=x0+1;x<x1;x++) if(tun[x]===0){ let e=x; while(e<x1 && tun[e]===0) e++; if(e-x<14) for(let k=x;k<e;k++) tun[k]=1; x=e; }   // no tiny gaps

      const name=R.tunnels[tn++%R.tunnels.length];

  }
  for(const pk of PARKS) if(pk.pipe){ const r=RUNS.find(q=>q.id===pk.run); pk.pipe.cx=[];

// crest of the snow banks along each run (a crisp line, stronger on big banks)
function buildCrest(){
  CREST=Array.from({length:NB}, () => []);
  for(const r of RUNS){ const S=r.S;
    for(let i=0;i<S.length-1;i++){ const a=S[i], c=S[i+1], dx=c.x-a.x, dy=c.y-a.y, L=Math.hypot(dx,dy)||1;
      for(const side of [0,1]){ const bk=a.bank[side]; if(bk<BANKS.min) continue;
        const nx=side===0?-dy/L:dy/L, ny=side===0?dx/L:-dx/L;
        for(let k=0;k<8;k+=3){ const x=a.x+dx*k/8+nx*(a.hw+3), y=a.y+dy*k/8+ny*(a.hw+3);
          if(edgeAt(x,y)<1 || !onMountain(x,y)) continue;
          const bi=Math.floor(y/BUCKET); if(bi>=0 && bi<NB) CREST[bi].push([x,y,nx<0?1:0,bk]); } } } }
}

  if(WORLD.bc){ const B=WORLD.bc; g.fillStyle='#5b616b'; g.fillRect(0,B.rockTop*s,w,(B.rockTo-B.rockTop)*s);
    for(const c2 of B.chutes){ g.fillStyle=c2.glacier?'#d3e9f8':'#ffffff'; for(let i=0;i<B.n;i+=3) if(c2.hws[i]>0) g.fillRect((c2.xs[i]-c2.hws[i])*s, (B.rockTop+i*4)*s, Math.max(1,2*c2.hws[i]*s), 1); }
    g.strokeStyle='#4a7fd0'; g.beginPath(); B.track && B.track.forEach((q,i)=>i?g.lineTo(q[0]*s,q[1]*s):g.moveTo(q[0]*s,q[1]*s)); g.stroke(); }
  g.fillStyle='#555'; for(const c2 of CLIFFS) if(!c2.ridge) g.fillRect(c2.x1*s,c2.y*s,Math.max(1,(c2.x2-c2.x1)*s),1);
  g.fillStyle='#f28c28'; for(const k of KICKERS) if(k.park) g.fillRect(k.x*s-1,k.y*s,2,1);

  g.restore();
  g.strokeStyle='#333'; g.lineWidth=0.6; for(const L of LIFTS){ g.beginPath(); g.moveTo(L.x1*s,L.y1*s); g.lineTo(L.x2*s,L.y2*s); g.stroke(); }

    const o2=c.createOscillator(); o2.type='square'; o2.frequency.value=54; const o2g=c.createGain(); o2g.gain.value=0.3;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=220; f.Q.value=0.7;

  const src=c.createBufferSource(); src.buffer=AUD.noise; const f=c.createBiquadFilter(); f.type='lowpass'; f.Q.value=0.5;
  f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(900,t+0.15); f.frequency.exponentialRampToValueAtTime(350,t+0.4);

// DJ music at the apres party - only plays (and fades in) while the party is on screen
const MUS = { next:0, step:0, bus:null };
function musicLoop(){
  const c=AUD.ctx; if(!c) return;

  const def=WORLD && DEFS[WORLD.id], spots=[];
  if(def && def.party) spots.push(def.party);
  if(def) for(const q of def.ponds||[]) if(q.party) spots.push({ x:q.x-q.rx-30, y:q.y-q.ry+100 });
  if(def) for(const pk of def.parks||[]) if(pk.dj) spots.push(pk.dj);
  if(def) for(const q of def.parties||[]) spots.push({ x:q.x+40, y:q.y });
  let target=0;
  if(game.mode==='play' || game.mode==='finish') for(const pq of spots){
    const vx=pq.x-cam.x, vy=pq.y-cam.y;
    if(vx>-90 && vx<VW+90 && vy>-70 && vy<VH+70){
      const d=Math.hypot(pq.x-(cam.x+VW/2), pq.y-(cam.y+VH/2)); target=Math.max(target, 0.5*(1-Math.min(0.85,d/380))); } }

function playStep(st,t){

    g.gain.exponentialRampToValueAtTime(0.0001,t+d); if(filt){ o.connect(filt); filt.connect(g); } else o.connect(g); g.connect(bus); o.start(t); o.stop(t+d+0.02); };

  if(s16%4===2){ const n=c.createBufferSource(); n.buffer=AUD.noise; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=7000;
    const g=c.createGain(); g.gain.setValueAtTime(0.1,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);

  if([0,3,6,8,10,14].includes(s16)){ const o=c.createOscillator(), f=c.createBiquadFilter(); o.type='sawtooth'; f.type='lowpass'; f.frequency.value=450;

    if(P.state==='air') wg += 0.018*Math.min(1,Math.hypot(P.vx,P.vy)/250); }
  AUD.wind.g.gain.setTargetAtTime(Math.max(0,wg),t,0.4); AUD.wind.f.frequency.setTargetAtTime(300+120*Math.sin(game.t*0.21),t,0.5);
}

function camTarget(){
  const near=Math.max(0,1-(P.y-START.y)/220);            // at the top, show the peak and the sky
  const x = P.state==='lift' ? P.x-VW/2 : clamp(P.x-VW/2,0,WORLD.w-VW);
  let y=P.y-VH*(0.32+0.34*near);
  if(WORLD.volcano && near>0) y=Math.max(P.y-VH*0.78, y+(CRATER_Y-VH*0.45-y)*near);   // Niseko: look up at the smoking crater, skier still in view
  if(P.state==='air') y=Math.min(y, P.y-P.z-100);
  if(P.state==='cat') y=P.y-VH*(Math.cos(P.catH)<0?0.62:0.35);   // look the way the cat is driving
  if(P.state==='tbar' || P.state==='skintrack') y=P.y-VH*0.6;           // big air: the camera follows you up instead of racing to the landing
  return { x, y };
}

function popup(txt, pts, col, big){ if(pts>0 && WORLD && WORLD.bc && WORLD.bc.double) pts*=2; if(pts>0) sfx('reward',pts); game.popups.unshift({ txt, pts, t:big?2.6:2.2, col:col||'#ffe066', big:!!big, row:-0.7 });
  game.popups.length=Math.min(game.popups.length,3); }
function puff(n, col){ for(let i=0;i<n;i++) game.parts.push({ x:P.x, y:P.y, z:2, vx:(Math.random()-0.5)*90,
  vy:(Math.random()-0.5)*60, vz:Math.random()*80, life:0.4+Math.random()*0.4, col:col||(Math.random()<0.5?'#c3d1e3':'#ffffff') }); }

function launch(vz, minor){
  P.vx=Math.sin(P.h)*P.v; P.vy=Math.cos(P.h)*P.v;
  P.state='air'; resetAir(); P.pipeAir=0; P.minor=!!minor; P.vz=vz; P.z=Math.max(P.z,1); P.skins=false; P.skinAnim=0;
  P.hop=false; P.canPop=false; P.popped=false; P.holdDown=!!keys.down; P.holdUp=!!keys.up;   // keys held from the ground don't flip you
  P.tracks.push(null); P.lastTrack=null;
}
function crash(msg, forceYard){
  if(P.state==='crash') return;
  const air=P.state==='air', speed=air?Math.hypot(P.vx,P.vy):P.v, head=air?Math.atan2(P.vx,P.vy):P.h;
  const yard = !!forceYard || speed>CFG.YARD_SALE || (air && !P.minor && P.vz<-260);
  const impact = speed + (air && !P.minor ? Math.max(0,-P.vz)*0.6 : 0), avy=msg.includes('AVALANCHE');
  const healOnly=msg.includes('onsen'), out=P.hp<=0 && !healOnly;
  const dmg = msg.includes('kei truck') ? 60 : avy ? (P.packs.bc ? 15 : 60) : Math.round(18+impact*0.08);
  if(healOnly) P.hp=100; else P.hp=Math.max(0,P.hp-dmg);
  const destroyed = !healOnly && (out || P.hp<=0);                       // health bar empty: the ski patrol heli is on its way
  P.wing=false; P.glide=false; P.loopT=0;
  P.state='crash'; P.yard=yard; P.pl=null; if(P.sx){ P.sx=null; popup('DNF', 0, '#ff6b5a'); } P.skins=false; P.skinAnim=0; P.crashT=yard?2.4:1.3; P.v=0; P.z=0; P.vz=0; resetAir();
  P.svx=Math.sin(head)*speed*0.35; P.svy=Math.cos(head)*speed*0.35;     // body slides a bit
  game.crashes++; P.gear=[];
  if(yard){
    for(const type of (CHARS[game.char].type==='ski' ? ['ski','ski','pole','pole'] : ['board','mitt','mitt'])){ const s=speed*(0.3+Math.random()*0.6);
      P.gear.push({ type, x:P.x, y:P.y, z:3, vx:Math.sin(head)*s+(Math.random()-0.5)*100, vy:Math.cos(head)*s+(Math.random()-0.5)*60,
        vz:80+Math.random()*120, rot:Math.random()*6.3, vr:(Math.random()-0.5)*20 }); }
    popup(destroyed?'DESTROYED!':'YARD SALE!', 0, destroyed?'#ff3a2a':'#ff6b5a', true); puff(40); sfx('yard');
    if(msg.startsWith('JERRY')) popup(msg, 0, '#ff6b5a', true);
  } else { popup(destroyed?'DESTROYED!':msg.toUpperCase(), 0, destroyed?'#ff3a2a':'#ff6b5a', destroyed); puff(22); sfx('crash'); }
  if(avy && P.packs.bc) setTimeout(()=>popup('BEACON, PROBE + SHOVEL: DUG OUT!', 0, '#bfe3ff', true), 1600);
  if(destroyed){ P.destroyed=true; P.crashT=1e9; game.heli={ t:0 }; setTimeout(()=>{ if(game.heli) popup('SKI PATROL IS ON THE WAY', 0, '#ffe066'); }, 900); }
  P.tracks.push(null); P.lastTrack=null;
}
function endAir(){        // score the trick that just finished
  const halves=Math.round(Math.abs(P.spin)/Math.PI), flips=Math.round(Math.abs(P.flip)/(2*Math.PI));
  const parts=[]; let pts=0;
  if(P.bestGrab){ parts.push(P.bestGrab); pts+=100+Math.round(P.grabT*250); }
  if(halves && flips){                                               // spinning AND flipping = a cork
    parts.push(['','','DOUBLE ','TRIPLE ','QUAD '][Math.min(flips,4)]+'CORK '+(halves*180)); pts+=halves*150+flips*flips*500+250; }
  else {
    if(halves){ parts.push(String(halves*180)); pts+=halves*150; }
    if(flips){ parts.push(['','','DOUBLE ','TRIPLE ','QUAD '][Math.min(flips,4)]+(P.flip>0?'BACKFLIP':'FRONTFLIP')); pts+=flips*flips*500; } }
  if(P.drop>0){ parts.push('CLIFF '+Math.round(P.drop*CFG.M)+'M'); pts+=Math.round(P.drop*4); }
  pts += Math.round(P.airT*50);
  if(!parts.length && P.airT>1.2) parts.push('BIG AIR');
  if(parts.length){ popup(parts.join(' '), pts); game.score+=pts; }
  if(pts+(P.airBonus||0)>=CFG.BEAST || P.drop>=110 || P.airT>=1.8){ popup('BEAST CANDIDE!', 0, '#7ee0ff', true); game.score+=500; sfx('beast'); }
  resetAir();
}
function land(){
  P.z=0;
  if(P.minor){ P.state='ride'; P.v=Math.hypot(P.vx,P.vy); P.h=clamp(Math.atan2(P.vx,P.vy),-1.8,1.8); resetAir(); return; }
  if(P.airT<0.7){ P.spin=Math.round(P.spin/Math.PI)*Math.PI; P.flip=Math.round(P.flip/(2*Math.PI))*2*Math.PI; }   // little airs: always land
  const sm=Math.abs(wrapPi(P.spin)), fm=Math.abs(wrapPi(P.flip));
  const bad = fm>CFG.LAND_FLIP ? 'Landed on your head'
            : (sm>CFG.LAND_SPIN && sm<Math.PI-CFG.LAND_SPIN) ? 'Landed sideways' : null;
  if(bad){ crash(bad); return; }
  P.v=Math.hypot(P.vx,P.vy); P.h=clamp(Math.atan2(P.vx,P.vy),-1.8,1.8);
  if(P.vz<-300) P.v*=0.85;           // hard landing
  if(P.pipeAir){ if(pipeAt(P.x,P.y)){ P.h=-P.pipeAir*0.95; P.v=Math.max(P.v,150); } P.pipeAir=0; }   // back down the wall and across the pipe
  if(rockAt(P.x,P.y)){ crash('Landed on the rocks'); return; }
  P.state='ride'; endAir(); puff(12); sfx('land');
}

function update(dt){
  game.t += dt;
  for(const p of game.popups) p.t-=dt; game.popups=game.popups.filter(p=>p.t>0);
  game.popups.forEach((p,k)=>{ p.row+=(k-p.row)*Math.min(1,dt*9); });          // slide down to make room for the new one
  for(const p of game.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.z=Math.max(0,p.z+p.vz*dt); p.life-=dt;
    if(p.plume){ p.s=Math.min(11,p.s+dt*2.4); }
    else if(p.smoke){ p.vz*=Math.pow(0.6,dt); p.vx*=Math.pow(0.5,dt); p.vy*=Math.pow(0.5,dt); p.s=Math.min(5,p.s+dt*3); } else p.vz-=300*dt; }
  game.parts=game.parts.filter(p=>p.life>0);
  if(WORLD.road && game.mode==='play') updRoad(dt);
  if(WORLD.volcano && game.mode!=='flight' && cam.y<700){ game.smokeAcc=(game.smokeAcc||0)+dt*16;   // a lazy plume of volcanic steam drifting off the crater
    while(game.smokeAcc>1){ game.smokeAcc--; const g=150+Math.random()*45|0;
      game.parts.push({ x:PEAK.x+(Math.random()-0.5)*50, y:CRATER_Y+2+(Math.random()-0.5)*10, z:0, vx:6+Math.random()*8, vy:-1, vz:16+Math.random()*12,
        life:4+Math.random()*2.5, col:'rgba('+(g+8)+','+g+','+(g+6)+',0.5)', s:2, plume:true }); } }
  for(const o of game.shaking) o.shake*=Math.exp(-2.5*dt);         // race flags settle down
  game.shaking=game.shaking.filter(o=>{ if(o.shake>0.05) return true; o.shake=0; return false; });
  for(const g of P.gear){                                         // yard-sale gear flying around
    g.x+=g.vx*dt; g.y+=g.vy*dt; g.z+=g.vz*dt; g.vz-=CFG.GZ*1.6*dt; g.rot+=g.vr*dt;
    if(g.z<=0){ g.z=0; if(g.vz<-50){ g.vz*=-0.35; g.vr*=0.6; } else g.vz=0;
      const f=Math.pow(0.08,dt); g.vx*=f; g.vy*=f; g.vr*=f; } }

  if(game.mode==='flight'){ updFlight(dt); return; }
  if(game.mode==='finish'){ P.state='ride'; P.v*=Math.pow(0.25,dt); P.x+=Math.sin(P.h)*P.v*dt; P.y+=Math.cos(P.h)*P.v*dt; followCam(dt); return; }
  if(game.mode!=='play') return;
  if(game.holdT>0){ game.holdT-=dt; followCam(dt); return; }      // waiting for the phone's full-screen notice to clear
  game.time += dt;
  updJerry(dt);

  if(game.avy){ const A=game.avy; A.t+=dt; const front=A.y+40+A.t*230, sp=A.t*35;      // avalanche: a powder cloud racing downhill
    for(let i=0;i<60*dt*8;i++) game.parts.push({ x:A.x1-sp+Math.random()*(A.x2-A.x1+2*sp), y:front-Math.random()*50, z:Math.random()*8,
      vx:(Math.random()-0.5)*30, vy:150+Math.random()*90, vz:8+Math.random()*16, life:0.8+Math.random()*0.6, col:Math.random()<0.6?'rgba(255,255,255,0.85)':'rgba(214,224,238,0.8)', s:2, smoke:true });
    if(P.state==='crash' && P.avyRide && A.t<2.2) P.y+=190*dt*(1-A.t/2.4);
    if(A.t>2.6) game.avy=null; }
  if(P.state==='crash' && P.destroyed){ P.x+=P.svx*dt; P.y+=P.svy*dt; const f=Math.pow(0.004,dt); P.svx*=f; P.svy*=f; updHeli(dt); return; }   // you lie still for the heli
  if(P.state==='crash'){
    P.crashT-=dt; P.x+=P.svx*dt; P.y+=P.svy*dt; const f=Math.pow(0.05,dt); P.svx*=f; P.svy*=f;
    if(P.crashT<=0){ P.state='ride'; P.h=0; P.v=0; P.inv=1.5; P.gear=[]; P.yard=false; P.avyRide=false; }
    followCam(dt); return;
  }
  if(P.state==='lift'){ updLift(dt); followCam(dt); return; }
  if(P.state==='cat'){ updCat(dt); followCam(dt); return; }
  if(P.state==='tbar'){ updTbar(dt); followCam(dt); return; }
  if(P.state==='skintrack'){ updSkinTrack(dt); followCam(dt); return; }
  if(P.inv>0) P.inv-=dt;
  if(P.wingCool>0) P.wingCool-=dt;
  if(P.state!=='crash') P.hp=Math.min(100,P.hp+dt*1.2);                    // health comes back slowly
  if(P.state==='ride' && P.v<60 && P.hp<99.5) for(const b of BUILDINGS){ if(b.name==='airport' || b.name==='Peak Express top' || b.name==='hut') continue;   // stop at a restaurant, lodge, spa or sauna to heal up
    if(Math.abs(P.x-b.x)<b.w/2+14 && P.y>b.y-6 && P.y<b.y+(b.spa?48:30)){ P.hp=100; sfx('chime');
      popup(b.hut?'SLEPT IN THE HUT: HEALTH RESTORED':b.sauna?'SAUNA: HEALTH RESTORED':b.spa?'SPA DAY: HEALTH RESTORED':b.curry?(b.ramen?'RAMEN: HEALTH RESTORED':'CURRY: HEALTH RESTORED'):'LUNCH BREAK: HEALTH RESTORED', 0, '#4ad07a', true); break; } }
  if(pressed.wing && (P.state==='ride' || P.state==='air') && !P.skins){
    if(!P.packs.para) popup('NO WING - GRAB A PARAGLIDER PACK AT A LIFT TOP', 0, '#ff9a6a');
    else { P.wing=!P.wing; popup(P.wing?'WING OPEN':'WING AWAY', 0, '#bfe3ff'); if(!P.wing && P.state==='air'){ P.glide=false; P.loopT=0; P.flip=0; } } }
  P.treeHits=Math.max(0,P.treeHits-dt*2.0);

  const px=P.x, py=P.y;
  const steer=(keys.right?1:0)-(keys.left?1:0);
  P.tuck = !!(keys.tuck || keys.up) && P.state==='ride' && !P.skins;     // W / up / Shift = tuck
  const stopKey = !!keys.down;                                             // S / down = stop

  if(P.state==='ride' && (P.skins || P.skinAnim>0)){ rideSkins(dt,steer); if(P.state==='lift'){ followCam(dt); return; } }
  else if(P.state==='ride'){
    const turn=(P.tuck?CFG.TUCK_TURN:CFG.TURN)*(P.v<20?1.6:1);
    P.h += steer*turn*dt;
    if(P.tuck && !steer) P.h -= P.h*Math.min(1,3*dt);        // tucking points you downhill
    P.h = clamp(P.h,-1.8,1.8);
    const s=slopeAt(P.x,P.y);
    // drag is set so that going straight you settle at VMAX (or VMAX_TUCK when tucked) on any slope;
    // pointing across the hill or turning keeps you well below that
    const vt=(P.tuck?CFG.VMAX_TUCK:CFG.VMAX)*(WORLD.bc ? (P.y<WORLD.bc.rockTo ? ((chuteAt(P.x,P.y)||{}).glacier ? 1.3 : 1.7) : P.y<WORLD.treeline ? 1.25 : 1) : 1);   // insane speeds in the chutes
    const k=Math.max(0.0005, CFG.G*Math.max(s,0.2)-CFG.FRICTION+(P.tuck?20:0))/(vt*vt);
    let a = CFG.G*s*Math.cos(P.h) - k*P.v*P.v;
    if(P.v>0) a -= CFG.FRICTION;
    if(steer) a -= 25 + CFG.TURN_SCRUB*P.v;                     // carving scrubs speed
    if(stopKey) a -= Math.max(CFG.BRAKE, CFG.G*s*Math.cos(P.h)+80);   // you can always dig in and stop, even on the steepest slopes
    if(P.tuck && P.v<110) a += CFG.SKATE;                       // tuck from slow = skate/push
    if(P.tuck) a += 20;
    P.v = Math.max(0, P.v + a*dt);
    P.x += Math.sin(P.h)*P.v*dt; P.y += Math.cos(P.h)*P.v*dt;
    if(P.v>20) dodgeTrees(dt);
    // hockey stop: S turns the skis/board sideways and throws a wall of snow
    P.skid += ((stopKey && P.v>15 ? 1 : 0) - P.skid)*Math.min(1,dt*12);
    if(steer) P.skidSide=steer;
    const dxh=Math.sin(P.h), dyh=Math.cos(P.h);
    if(stopKey && P.v>25){
      const n=Math.min(6, 1+(P.v/40|0));
      for(let i=0;i<n;i++) game.parts.push({ x:P.x+dxh*3+(Math.random()-0.5)*7, y:P.y+dyh*3, z:1+Math.random()*2,
        vx:dxh*P.v*(0.5+Math.random()*0.5)+(Math.random()-0.5)*60, vy:dyh*P.v*(0.5+Math.random()*0.5)+(Math.random()-0.5)*30,
        vz:50+Math.random()*70, life:0.4+Math.random()*0.3, col:Math.random()<0.5?'#ffffff':'#a9bcd6', s:Math.random()<0.4?2:1 });
    }
    // carving: snow sprays off the outside of the turn
    if(steer && P.v>70 && !stopKey){
      const ox=-steer*Math.cos(P.h), oy=steer*Math.sin(P.h), n=1+Math.min(3,(P.v-70)/50|0);
      for(let i=0;i<n;i++) game.parts.push({ x:P.x+ox*3, y:P.y+oy*3, z:1,
        vx:ox*(40+Math.random()*60)+dxh*P.v*0.4, vy:oy*(40+Math.random()*60)+dyh*P.v*0.4,
        vz:30+Math.random()*50, life:0.3+Math.random()*0.3, col:Math.random()<0.5?'#ffffff':'#a9bcd6', s:Math.random()<0.3?2:1 });
    }
    if(!P.lastTrack || Math.hypot(P.x-P.lastTrack[0],P.y-P.lastTrack[1])>3){
      P.lastTrack=[P.x,P.y,P.h]; P.tracks.push(P.lastTrack); if(P.tracks.length>900) P.tracks.shift(); }
    // lift loading zones: stop in one and the lift takes you up
    let zone=null;
    for(const L of LIFTS) if(Math.abs(P.x-(L.x1+4))<14 && P.y>L.y1+4 && P.y<L.y1+24){ zone=L; break; }
    let cat=null;
    if(!zone) for(const pk of PARKS) if(pk.cat && Math.abs(P.x-pk.cat.x)<45 && P.y>pk.cat.y-60 && P.y<pk.cat.y+50){ cat=pk.cat; break; }
    const A=WORLD.air, pad = !zone && !cat && A && Math.abs(P.x-A.x)<17 && Math.abs(P.y-A.y)<11 ? A : null;   // airport box
    P.inZone=zone||cat||pad;
    if((zone||cat||pad) && P.v<(cat?40:25)){ P.loadT+=dt; if(P.loadT>(pad?0.6:0.5)){ if(pad){ flyTo(pad.to); return; } if(zone) boardLift(zone); else boardCat(cat); followCam(dt); return; } } else P.loadT=0;
    { const i0=Math.floor(P.y/BUCKET);                                  // ski over a pack to grab it
      for(let ii=i0-1;ii<=i0+1;ii++) for(const o of buckets[ii]||[]) if(o.kind==='pack' && Math.hypot(P.x-o.x,P.y-o.y)<12) takePack(o); }
    if((zone||cat||pad) && P.wing) P.wing=false;                         // pack the wing away for the lift
    // hold S while stopped (not in a lift line) to put your skins on - skins come in the backcountry pack
    if(stopKey && P.v<5 && !zone && !P.wing){ if(!P.packs.bc){ P.skinHold+=dt; if(P.skinHold>=CFG.SKIN_HOLD){ P.skinHold=0; popup('NO SKINS - GRAB A BACKCOUNTRY PACK AT A LIFT TOP', 0, '#ff9a6a'); } }
      else { P.skinHold+=dt; if(P.skinHold>=CFG.SKIN_HOLD){ P.skinHold=0; P.skinAnim=1.0; P.v=0; } } } else P.skinHold=0;
    if(P.wing && !P.skins && P.v>CFG.WING_TAKEOFF && !(P.wingCool>0)){ launch(70,false); P.glide=true; popup('TAKE OFF!', 0, '#ffe066'); return; }
    if(pressed.jump){ launch(CFG.OLLIE, false); P.hop=true; }  // small hop - time it at a lip for a pop
  }
  else if(P.state==='air' && P.wing && !P.minor){                  // paragliding: steer, dive (tuck), flare (stop), JUMP = loop
    P.airT += dt; P.glide=true;
    const sp=Math.hypot(P.vx,P.vy), ang=Math.atan2(P.vx,P.vy)+steer*1.7*dt, tgt=keys.up?240:keys.down?60:150;
    const ns=sp+(tgt-sp)*Math.min(1,dt*(keys.down?0.7:1.2)); P.vx=Math.sin(ang)*ns; P.vy=Math.cos(ang)*ns;
    const stall=keys.down && ns<92;                                            // pulled too long: the wing stalls
    if(stall && !P.stalled){ P.stalled=true; popup('STALL!', 0, '#ff9a6a'); } if(!keys.down) P.stalled=false;
    const sink=keys.up?-70 : keys.down ? (stall?-60:34*Math.min(1,(ns-90)/60)) : -26;   // dive: trade height for speed / pull: trade speed for height
    if(P.vz>sink) P.vz=Math.max(sink, P.vz-CFG.GZ*0.42*dt); else P.vz+=(sink-P.vz)*Math.min(1,2.5*dt);
    if(keys.down && !stall && P.vz<sink) P.vz+=(sink-P.vz)*Math.min(1,2.5*dt);
    if(pressed.jump && !(P.loopT>0)){ P.loopT=0.9; sfx('pop'); }
    if(P.loopT>0){ P.loopT-=dt; P.flip=(1-Math.max(0,P.loopT)/0.9)*Math.PI*2;
      if(P.loopT<=0){ P.flip=0; P.loops=(P.loops||0)+1; const nm=['LOOP!','DOUBLE LOOP!','TRIPLE LOOP!','QUAD LOOP!'][Math.min(3,P.loops-1)]; popup(nm, 300*P.loops, '#ffe066'); game.score+=300*P.loops; } }
    P.x+=P.vx*dt; P.y+=P.vy*dt;
    P.z=Math.min(150, P.z + P.vz*dt + Math.min(1.2,Math.max(0,slopeAt(P.x,P.y)))*Math.max(0,P.vy)*dt*0.1);   // the hill falls away beneath you
    if(P.z<14) dodgeTrees(dt);
    if(P.z<=0){ P.z=0;
      if(P.loopT>0){ P.loopT=0; P.flip=0; P.wing=false; crash('LOOPED INTO THE SNOW'); }
      else { const t=P.airT, pts=Math.round(t*40); P.state='ride'; P.v=Math.hypot(P.vx,P.vy); P.h=clamp(Math.atan2(P.vx,P.vy),-1.8,1.8);
        popup('PARAGLIDE '+t.toFixed(1)+'S', pts, '#bfe3ff'); game.score+=pts; resetAir(); P.loops=0; P.glide=false; P.wingCool=1.2; puff(10); sfx('land'); } }
  }
  else if(P.state==='air'){
    P.airT += dt;
    if(P.minor){                                                // mogul pop: still steers
      const sp=Math.hypot(P.vx,P.vy), ang=Math.atan2(P.vx,P.vy)+steer*CFG.TURN*dt;
      P.vx=Math.sin(ang)*sp; P.vy=Math.cos(ang)*sp;
    } else {
      P.spin += steer*CFG.SPIN*dt;                              // A/D spin
      if(!keys.down) P.holdDown=false; if(!keys.up) P.holdUp=false;
      const late=P.airT>0.25;                                   // still holding it a moment after takeoff = you mean it
      const fin=(keys.down && (!P.holdDown||late)?1:0)-(keys.up && (!P.holdUp||late)?1:0);
      P.flip += fin*CFG.FLIP*dt;                                // S backflip, W frontflip (fresh presses only)
      if(pressed.jump && P.canPop && !P.popped && P.airT<0.3){ P.vz+=CFG.POP; P.popped=true; popup('POP!', 0, '#bfe3ff'); sfx('pop'); }
      const GN = CHARS[game.char].type==='ski' ? ['MUTE','SAFETY','JAPAN'] : ['INDY','METHOD','MELON'];
      const g = keys.g1?GN[0]:keys.g2?GN[1]:keys.g3?GN[2]:null;
      P.grab = g; if(g){ P.bestGrab=g; P.grabT+=dt; }
      if(P.vz<0 && P.z<30){                                     // landing assist near the snow
        const a=CFG.ASSIST*dt;
        if(!steer){ const t=Math.round(P.spin/Math.PI)*Math.PI; P.spin+=clamp(t-P.spin,-a,a); }
        if(!fin){ const t=Math.round(P.flip/(2*Math.PI))*2*Math.PI; P.flip+=clamp(t-P.flip,-a,a); }
      }
    }
    P.vy += CFG.G*0.1*dt;
    const ad=1-CFG.AIR_DRAG*dt; P.vx*=ad; P.vy*=ad;
    P.x += P.vx*dt; P.y += P.vy*dt;
    P.vz -= CFG.GZ*dt; P.z += P.vz*dt;
    if(P.z<14) dodgeTrees(dt);
    if(P.z<=0) land();
  }
  else if(P.state==='grind'){
    P.y += P.v*dt; P.v=Math.max(40,P.v-15*dt); P.grindT+=dt; P.x=P.box.x;
    if(Math.random()<0.5) game.parts.push({ x:P.x, y:P.y, z:3, vx:(Math.random()-0.5)*40, vy:-10, vz:30, life:0.25, col:'#ffd23f' });
    if(pressed.jump || P.y>=P.box.y+P.box.len){
      const pts=Math.round(80+P.grindT*300); popup(P.box.len>100?'RAIL SLIDE':'50-50 BOX', pts); game.score+=pts;
      P.state='ride'; P.h=0; launch(pressed.jump?110:35, false); P.box=null;
    }
  }

  // snow banks: ski off the side of a run and the bank throws you into the air;
  // the bigger the bank and the harder you cut across it, the bigger the air.
  { const eNow=edgeAt(P.x,P.y);
    if(P.state==='ride' && !P.skins && !(P.skinAnim>0) && E.r && P.lastE!==null){
      const bk=bankAt();
      if(P.lastE<=0 && eNow>0 && bk>BANKS.min){
        const S=E.r.S, a=S[E.i], c=S[Math.min(E.i+1,S.length-1)], dx=c.x-a.x, dy=c.y-a.y, L=Math.hypot(dx,dy)||1;
        const nx=E.side===0?-dy/L:dy/L, ny=E.side===0?dx/L:-dx/L;
        const out=(Math.sin(P.h)*nx+Math.cos(P.h)*ny)*P.v;          // speed heading over the bank
        if(out>15){ launch(Math.min(CFG.BANK_MAX, bk*(40+out*CFG.BANK_POP)), false); P.canPop=true; }   // real air: spin it
      } else if(P.lastE>0 && eNow<=0 && bk>0.25 && P.v>40){ launch(20,true); P.z+=bk*12; }   // hop down off the bank
    }
    P.lastE=eNow; }

  // stay on the mountain
  P.y=Math.max(P.y, PEAK.y+40);
  if(WORLD.bc){ const sy=skyY(P.x)+6; if(P.y<sy) P.y=sy; }
  const hw=halfW(P.y); P.x=clamp(P.x, PEAK.x-hw+8, PEAK.x+hw-8);
  interact(px,py);
  if(P.state!=='crash') collide();
  if(P.state==='ride' && !P.skins){ const q=pipeAt(P.x,P.y);       // halfpipe walls
    if(q){ const [pk,dx]=q, W=pk.pipe.w/2, sd=Math.sign(dx)||1, out=Math.sin(P.h)*sd;
      if(Math.abs(dx)>W-3 && out>0.12){
        if(P.v>55){ const vz=Math.min(CFG.PIPE_MAX, 30+P.v*Math.abs(Math.sin(P.h))*0.95+P.v*0.2);
          launch(vz,false); P.z=10; P.vx=-sd*8; P.vy=Math.max(30,P.v*Math.cos(P.h)*0.55); P.pipeAir=sd; P.canPop=true; sfx('pop'); }
        else { P.h=-P.h*0.7; P.v*=0.8; } }                            // too slow: you slide back down the wall
      else if(Math.abs(dx)>W*0.5) P.v+=(out>0?-60:60)*dt*Math.abs(Math.sin(P.h)); } }   // up the wall slows you, dropping in speeds you up
  if(WORLD.sx && (P.state==='ride' || P.state==='air') && P.y>WORLD.sx.y1-20 && P.y<WORLD.sx.y2+30){   // fenced course: bounce off the fence
    const r=RUNS.find(q=>q.id===WORLD.sx.run), e1=runQ(r,P.x,P.y);
    if(P.inCourse && e1>-2.5){ let a=r.S[0], bd=1e9;                     // push back inside the fence
      for(const q of r.S){ if(Math.abs(q.y-P.y)>40) continue; const d=Math.hypot(q.x-P.x,q.y-P.y); if(d<bd){ bd=d; a=q; } }
      const dx=P.x-a.x, sd=Math.sign(dx)||1; P.x=a.x+sd*Math.max(0,a.hw-3);
      if(P.state==='air') P.vx=-sd*Math.abs(P.vx)*0.3; else { if(Math.sin(P.h)*sd>0) P.h=-P.h*0.5; P.v*=0.85; }
      if(!P.fenceT){ sfx('tap'); P.fenceT=0.3; } }
    else if(e1<-4) P.inCourse=true; }
  else P.inCourse=false;
  if(P.fenceT) P.fenceT=Math.max(0,P.fenceT-dt);
  for(const u of STEPUPS) if(py<u.y && P.y>=u.y && P.x>u.x1 && P.x<u.x2){
    if(P.state==='ride'){ P.v*=0.6; popup('CASED THE STEP-UP!', 0, '#ff6b5a'); sfx('land'); }
    else if(P.state==='air'){ P.z-=u.h; if(P.z<=0){ P.z=0; P.v*=0.7; popup('CASED IT!', 0, '#ff6b5a'); } } }
  if(WORLD.sx && (P.state==='ride' || P.state==='air')){             // ski cross: timed from the start gate to the finish line
    const X=WORLD.sx, on=(runAt(P.x,P.y)||{}).id===X.run || P.state==='air';
    if(!P.sx && py<X.y1 && P.y>=X.y1 && on){ P.sx={ t0:game.time, off:0 }; popup('SKI CROSS - GO!', 0, '#ffe066', true); sfx('chime'); }
    if(P.sx){ P.sx.off = on ? 0 : P.sx.off+dt;
      if(P.sx.off>1.5){ P.sx=null; popup('OFF COURSE', 0, '#ff6b5a'); }
      else if(P.y>=X.y2){ const t=game.time-P.sx.t0; P.sx=null;
        const best=WORLD.sxBest||1e9; WORLD.sxBest=Math.min(best,t); const pts=Math.max(200,Math.round(3200-t*90));
        popup('SKI CROSS '+t.toFixed(1)+' S'+(t<best?'  BEST!':''), pts, '#7ee0ff', true); game.score+=pts; sfx('beast'); } } }
  if(P.state==='ride'){
    const g=WORLD.gate;                                              // Blackcomb: the backcountry access gate (skins on to go through)
    if(g && P.skins && Math.abs(P.x-g.x)<28 && P.y>g.y-14 && P.y<g.y+14){ travel('backcountry', g.arrive||DEFS.backcountry.tele, g.arrive?'THE FAR SIDE OF THE BACKCOUNTRY':'WELCOME TO THE BACKCOUNTRY'); return; }
    const B=WORLD.bc;
    if(B){
      if(P.y>WORLD.h-60){ travel('blackcomb', B.exitTo, 'SKIED OUT TO BLACKCOMB'); return; }   // the bottom: out to Blackcomb
      if(rockAt(P.x,P.y)){
        if(!rockAt(px,py)){                                          // ran into rock: bounce back off it
          const side=rockAt(P.x,py), into=P.v*Math.abs(side?Math.sin(P.h):Math.cos(P.h));
          P.x=px; P.y=py;
          if(into>160 && !P.skins){ crash(side?'Smashed into the rock wall':'Smashed into the rocks'); return; }
          if(side) P.h=-P.h*0.4; else { P.v*=0.3; P.h+=(P.h>=0?0.6:-0.6); } P.v*=0.85; }
        else { const q=nearChute(P.x,P.y); if(q){ const sd=Math.sign(P.x-q[1])||1; P.x=q[1]+sd*(q[2]-1.5); } } }   // stuck inside: pop out into the nearest chute
      if(P.v<25){ let bi=-1, bd=13;                                  // stop on the skin track (with skins on) and it takes you up
        for(let i=0;i<B.track.length-20;i+=2){ const q=B.track[i], d=Math.abs(q[0]-P.x)+Math.abs(q[1]-P.y); if(d<bd){ bd=d; bi=i; } }
        P.nearTrack=bi>=0;
        if(bi>=0 && P.skins){ P.inZone=true; P.stLoad=(P.stLoad||0)+dt; if(P.stLoad>0.5){ boardSkinTrack(bi); return; } } else P.stLoad=0; }
      else { P.nearTrack=false; P.stLoad=0; }
      if(P.v<30 && !P.skins){ const c=CLIFFS.find(c=>c.cornice && !c.broke && P.x>c.x1+4 && P.x<c.x2-4 && P.y>c.y-36 && P.y<c.y+2);   // standing on a cornice...
        if(c){ P.avyT=(P.avyT||0)+dt; if(P.avyT>0.7){ P.avyT=0; c.broke=true; game.avy={ x1:c.x1, x2:c.x2, y:c.y, t:0 };
            popup('WHUMPF!', 0, '#ff6b5a', true); sfx('crash'); crash('CAUGHT IN AN AVALANCHE', true); P.svx=0; P.svy=0; P.crashT=3; P.avyRide=true; return; } }
        else P.avyT=0; } else P.avyT=0;
    }
  }
  // onsen: ski across fast and you pond skim, go in slowly and you take a dip
  { let inAny=false;
    for(const q of PONDS){ if(!q.rect) continue;                      // the long skim pool
      const inside=Math.abs(P.x-q.x)<q.rx && Math.abs(P.y-q.y)<q.ry, m=Math.max(0,Math.round((P.y-(q.y-q.ry))*CFG.M));
      if(P.skimQ===q && !inside){                                    // came out the other end (or off the side)
        P.skimQ=null;
        if(P.y>=q.y+q.ry-2){ popup('MADE IT ACROSS! '+Math.round(2*q.ry*CFG.M)+' M', 1000, '#7ee0ff', true); sfx('beast'); }
        else { popup('SKIMMED '+m+' M', m*20); } }
      if(!inside || P.state!=='ride') continue;
      inAny=true;
      if(P.skimQ!==q){
        if(P.v<CFG.SKIM_SINK){ P.x=q.x+q.rx+8; crash('Took a dip in the pond skim'); P.svx=0; P.svy=0; continue; }
        P.skimQ=q; P.skimV=P.v; P.skimming=true; popup('POND SKIM!', 0); sfx('splash'); }
      P.skimV-=CFG.SKIM_DECEL*dt; P.v=P.skimV;
      for(let i=0;i<3;i++) game.parts.push({ x:P.x+(Math.random()-0.5)*6, y:P.y+1, z:1, vx:(Math.random()-0.5)*80-Math.sin(P.h)*30,
        vy:(Math.random()-0.5)*30-Math.cos(P.h)*30, vz:40+Math.random()*60, life:0.4, col:Math.random()<0.5?'#bfe8f5':'#5fbcd2', s:Math.random()<0.4?2:1 });
      if(P.skimV<CFG.SKIM_SINK){ P.skimQ=null; popup('SKIMMED '+m+' M', m*20); sfx('splash');
        P.x=q.x+q.rx+8; crash('Sank in the pond skim'); P.svx=0; P.svy=0; }
    }
    for(const q of PONDS){ if(q.rect) continue; const a=(P.x-q.x)/q.rx, b=(P.y-q.y)/q.ry; if(a*a+b*b>=1 || P.state!=='ride') continue;
      inAny=true;
      if(P.v>60){ P.v*=Math.pow(0.75,dt);
        for(let i=0;i<3;i++) game.parts.push({ x:P.x+(Math.random()-0.5)*6, y:P.y+1, z:1, vx:(Math.random()-0.5)*80-Math.sin(P.h)*30,
          vy:(Math.random()-0.5)*30-Math.cos(P.h)*30, vz:40+Math.random()*60, life:0.4, col:Math.random()<0.5?'#bfe8f5':'#5fbcd2', s:Math.random()<0.4?2:1 });
        if(!P.skimming){ P.skimming=true; const sp=q.skim?400:250; popup('POND SKIM!', sp); game.score+=sp; sfx('splash'); } }
      else { P.y=q.y+q.ry+8; crash('Took a dip in the onsen'); P.svx=0; P.svy=0; popup('ONSEN: HEALTH RESTORED', 0, '#4ad07a', true); }
    }
    if(!inAny) P.skimming=false; }

  { const sp=P.state==='air'?Math.hypot(P.vx,P.vy):P.v;          // blast past a race flag and it shakes
    if(sp>90 && (P.state==='ride' || (P.state==='air' && P.z<20))){ const i0=Math.floor(P.y/BUCKET)-1;
      for(let i=i0;i<=i0+2;i++){ const b=buckets[i]; if(!b) continue;
        for(const o of b) if(o.t==='gate' && Math.abs(o.x-P.x)<22 && Math.abs(o.y-P.y)<12){
          const s2=Math.min(1.6,sp/180); if(s2>o.shake){ if(o.shake===0) game.shaking.push(o); o.shake=s2; } } } } }

  if(P.state==='ride' && P.y>py){ const i0=Math.floor(P.y/BUCKET)-1;      // race gates: around the outside = speed boost, clip it = speed cut
    for(let i=i0;i<=i0+2;i++){ const b=buckets[i]; if(!b) continue;
      for(const o of b) if(o.t==='gate' && py<o.y && P.y>=o.y){ const dx=P.x-o.x, out=dx*o.gs;
        if(Math.abs(dx)<4){ P.v*=0.6; o.shake=1.6; if(!game.shaking.includes(o)) game.shaking.push(o); P.gateRun=0; popup('HIT THE GATE!', 0, '#ff6b5a'); sfx('tap'); }
        else if(out>0 && out<26){ const k=1-(out-4)/22, boost=1.06+0.12*k; P.v=Math.min(P.v*boost, CFG.VMAX_TUCK*1.25); P.gateRun=(P.gateRun||0)+1;
          const pts=25*P.gateRun; game.score+=pts; popup(P.gateRun>1?'CLEAN GATE x'+P.gateRun:'CLEAN GATE', pts, '#7ee0ff'); if(AUD.ctx && AUD.on) whoosh(); }
        else if(out<0 && out>-26) P.gateRun=0; } } }
  if(P.y>=WORLD.finish && game.mode==='play'){
    game.mode='finish'; if(P.state==='air'||P.state==='grind'){ P.z=0; P.state='ride'; }
    if(game.score>game.best){ game.best=game.score; try{ localStorage.setItem('whistlerShredBest',game.best); }catch(e){} }
  }
  followCam(dt);
}

function interact(px,py){
  for(const c of CLIFFS){                                       // cliffs, ridges, pillows
    if(P.x<=c.x1 || P.x>=c.x2) continue;
    const h=cliffH(c,P.x); if(h<=0) continue;
    const ly=lipY(c,P.x);
    if(py<ly && P.y>=ly && (P.state==='ride' || P.state==='air')){
      // over the lip: the snow drops away by h. Move to the base of the face
      // and lift by h so the skier stays put on screen, then floats down.
      if(P.state==='ride'){ launch(25,false); P.canPop=true; }
      P.y+=h; P.z+=h; P.drop+=h; P.minor=false;
      if((c.pillow||c.fence) && c.line){ const pl=P.pl;
        if(pl && pl.line===c.line && game.time-pl.t<4 && !pl.hit.includes(c)){ pl.n++; pl.t=game.time; pl.hit.push(c); }
        else if(!pl || pl.line!==c.line || game.time-pl.t>=4) P.pl={ line:c.line, n:1, t:game.time, hit:[c], done:false };
        if(P.pl.n>=3 && !P.pl.done){ P.pl.done=true; popup(c.fence?'SNOW GATE BOUNCE LINE!':'BEAST PILLOW LINE!', 750, '#7ee0ff', true); game.score+=750; sfx('beast'); } }
      break;
    } else if(P.state==='ride' && P.y>ly && P.y<ly+h){
      const inX = px>c.x1 && px<c.x2, prevBot = inX ? lipY(c,px)+cliffH(c,px) : -1e9, depth=(P.y-ly)/h;
      const intoFace = !c.pillow && ((inX && py>=prevBot-2) || (!inX && depth>0.35));
      if(intoFace){                                             // skied right into the rock
        if(P.v>60){ P.y=ly+h+3; crash('Hit the cliff face', true); return; }   // fast = yard sale
        P.y=ly+h+2; P.v*=0.3; break; }                          // slow = just bump off it
      // clipped the top edge from the side or slid along the lip: you go off the edge instead
      const d=ly+h-P.y; launch(15,false); P.canPop=true; P.z+=d; P.y=ly+h; P.drop+=d; break;
    }
  }
  if((P.state==='ride' && !P.skins) || (P.state==='air' && P.hop && P.z<10)) for(const k of KICKERS){   // kickers
    if(py<k.y && P.y>=k.y && Math.abs(P.x-k.x)<k.w/2){
      const popped = P.state==='air';                            // hopped right at the lip = pop
      if(popped){ P.v=Math.hypot(P.vx,P.vy); P.h=clamp(Math.atan2(P.vx,P.vy),-1.8,1.8); }
      launch(Math.min(k.comp?CFG.COMP_KICK_MAX:k.mega?CFG.MEGA_KICK_MAX:CFG.KICK_MAX, P.v*CFG.KICK*k.pow+30)+(popped?CFG.POP:0), false);
      if(popped){ P.popped=true; popup('POP!', 0, '#bfe3ff'); sfx('pop'); } else P.canPop=true;
      break; }
  }
  if(P.state==='ride' || (P.state==='air' && P.z<8 && P.vz<0)) for(const b of BOXES){   // boxes and rails
    if(Math.abs(P.x-b.x)<4 && P.y>b.y && P.y<b.y+b.len){
      const head = P.state==='air' ? Math.atan2(P.vx,P.vy)+P.spin : P.h;
      const hd=Math.abs(wrapPi(head)), aligned = hd<0.5 || hd>Math.PI-0.5;
      if(aligned && Math.abs(wrapPi(P.flip))<0.8 && !P.grab){
        if(P.state==='air'){ P.v=Math.hypot(P.vx,P.vy); if(!P.minor) endAir(); }
        P.state='grind'; P.box=b; P.x=b.x; P.z=3; P.grindT=0; P.h=0;
      } else if(P.state==='ride') crash('Clipped the box');
      break;
    }
  }
}

function collide(){
  const i0=Math.floor(P.y/BUCKET)-1;
  for(let i=i0;i<=i0+2;i++){ const b=buckets[i]; if(!b) continue;
    for(const o of b){
      if(o.t==='mogul'){
        if(P.state==='ride' && P.lastMogul!==o && Math.hypot(P.x-o.x,P.y-o.y)<o.r){
          P.lastMogul=o;
          if(keys.down) P.v*=0.97; else if(P.v>110) launch(30+P.v*0.1,true); else P.v*=0.92;
        }
        continue;
      }
      if(P.inv>0 || P.state==='grind') continue;
      if(o.t==='bldg'){
        if(P.x>o.x-o.w/2 && P.x<o.x+o.w/2 && P.y>o.y-o.h*0.6 && P.y<o.y && P.z<o.h){ crash('Skied into the lodge'); return; }
        continue;
      }
      if(o.t==='party') continue;                              // the party crowd gets out of your way
      const hgt = o.t==='tree' ? (o.s?10:14) : o.t==='rock' ? 5 : 16;
      if(o.t==='tree'){
        if(P.state==='air' && !o.tapped && P.z>=hgt-4 && P.z<hgt+10 && Math.hypot(P.x-o.x,P.y-o.y)<7){ tapTree(o,hgt); continue; }   // tree tap!
        if(P.z<hgt && P.lastTree!==o && brushTree(o)) return; continue; }
      if(P.z<hgt && Math.hypot(P.x-o.x,P.y-o.y)<o.r+1.5){
        crash(o.t==='rock'?'Core shot on a rock':'Hit a lift tower'); return; }
    }
  }
}

// Steer around trees that are just ahead (the skier "sees" them and dodges).
function dodgeTrees(dt){
  const air=P.state==='air', head=air?Math.atan2(P.vx,P.vy):P.h, tx=Math.sin(head), ty=Math.cos(head);
  const speed=air?Math.hypot(P.vx,P.vy):P.v, look=10+speed*0.08;
  const i0=Math.floor(P.y/BUCKET)-1; let push=0;
  for(let i=i0;i<=i0+2;i++){ const b=buckets[i]; if(!b) continue;
    for(const o of b){ if(o.t!=='tree') continue;
      const dx=o.x-P.x, dy=o.y-P.y, ahead=dx*tx+dy*ty; if(ahead<-2 || ahead>look) continue;
      const lat=dx*ty-dy*tx; if(Math.abs(lat)>7) continue;
      push += (lat>=0?-1:1)*(1-Math.max(0,ahead)/look)*(1.3-Math.abs(lat)/7);
    } }
  if(push){ const k=CFG.TREE_DODGE*clamp(push,-1.5,1.5)*dt; P.x+=ty*k; P.y-=tx*k; }
}
// Trees push you aside instead of always crashing.
function brushTree(o){
  const dx=P.x-o.x, dy=P.y-o.y, R=o.r+0.5;
  if(dx*dx+dy*dy>=R*R) return false;
  P.lastTree=o;
  const air=P.state==='air';
  const head= air ? Math.atan2(P.vx,P.vy) : P.h, tx=Math.sin(head), ty=Math.cos(head);
  const lat=dx*ty-dy*tx, side=lat>=0?1:-1;
  const speed= air ? Math.hypot(P.vx,P.vy) : P.v;
  const deadOn=Math.abs(lat)<0.8;
  P.treeHits += (deadOn?1.5:0.7)*(o.s?0.6:1);
  if((deadOn && speed>260) || P.treeHits>=CFG.TREE_CRASH){ crash('Tree!'); return true; }
  const push=R-Math.abs(lat)+1;
  P.x+=ty*side*push; P.y-=tx*side*push;
  const keep=deadOn?0.7:0.93;
  if(air){ const sp=speed*keep, a=head+side*0.2; P.vx=Math.sin(a)*sp; P.vy=Math.cos(a)*sp; }
  else { P.h=P.skins ? wrapPi(P.h+side*0.2) : clamp(P.h+side*0.2,-1.8,1.8); P.v*=keep; }
  for(let i=0;i<6;i++) game.parts.push({ x:o.x+(Math.random()-0.5)*8, y:o.y, z:6+Math.random()*8,
    vx:(Math.random()-0.5)*40, vy:(Math.random()-0.5)*20, vz:Math.random()*30, life:0.5, col:Math.random()<0.3?'#2f6b3f':'#ffffff' });
  return false;
}

// skins: pull them out (they flap in the wind for a second), then walk uphill slowly
function rideSkins(dt,steer){
  if(P.skinAnim>0){ P.v=0; P.skinAnim-=dt;
    if(P.skinAnim<=0){ P.skins=true; P.h=Math.PI*0.72; popup('SKINS ON', 0, '#bfe3ff'); }   // start on a traverse
    return; }
  P.h=wrapPi(P.h+steer*2.2*dt);                                   // turn any direction, including uphill
  const uphill=Math.max(0,-Math.cos(P.h)), s=slopeAt(P.x,P.y);
  let sp=CFG.SKIN_SPEED*(1-0.45*uphill*Math.min(1,s));
  const dev=Math.abs(wrapPi(P.h-Math.PI));                         // 0 = pointing straight up the fall line
  P.skinSteep = s>0.35 && dev<0.55;
  if(P.skinSteep) sp*=0.08;                                        // too steep to go straight up - zig-zag like a real skin track
  P.v = keys.up ? sp : 0;
  P.x+=Math.sin(P.h)*P.v*dt; P.y+=Math.cos(P.h)*P.v*dt;
  if(P.v>0 && (!P.lastTrack || Math.hypot(P.x-P.lastTrack[0],P.y-P.lastTrack[1])>3)){
    P.lastTrack=[P.x,P.y,P.h]; P.tracks.push(P.lastTrack); if(P.tracks.length>900) P.tracks.shift(); }
  let zone=null;                                                  // you can still load a lift on skins
  for(const L of LIFTS) if(Math.abs(P.x-(L.x1+4))<14 && P.y>L.y1+4 && P.y<L.y1+24){ zone=L; break; }
  P.inZone=zone;
  const A=WORLD.air, pad = !zone && A && Math.abs(P.x-A.x)<17 && Math.abs(P.y-A.y)<11 ? A : null;   // ...and get on the plane
  if(pad) P.inZone=pad;
  if((zone||pad) && P.v<25){ P.loadT+=dt; if(P.loadT>(pad?0.6:0.5)){ P.skins=false; if(pad){ flyTo(pad.to); return; } boardLift(zone); return; } } else P.loadT=0;
  if(pressed.jump){ P.skins=false; P.h=0; P.v=0; popup('SKINS OFF - TIME TO SHRED', 0, '#bfe3ff'); }
}

// lifts
function boardLift(L){
  if(L.tbar){ boardTbar(L); return; }
  Object.assign(P,{ state:'lift', lift:L, liftD:0, liftRev:false, v:0, loadT:0, inZone:null });
  popup('RIDING '+L.name.toUpperCase(), 0, '#bfe3ff'); sfx('chime'); P.tracks.push(null); P.lastTrack=null;
  if(L.to && !MAPS[L.to]) setTimeout(()=>{ if(!MAPS[L.to]) MAPS[L.to]=buildMap(DEFS[L.to]); }, 80);   // build the next mountain while you ride
}
function travel(to, at, msg){                     // go to another mountain: built the first time you go, then kept
  game.mode='travel'; game.travelMsg=to==='backcountry'?'HEADING INTO THE BACKCOUNTRY...':'SKIING OUT TO '+DEFS[to].name.toUpperCase()+'...';
  setTimeout(()=>{ const sc=game.score, tm=game.time; switchMap(to); game.jerry.active=false; game.avy=null;
    resetSkier(at); Object.assign(game,{ score:sc, time:tm, parts:[], popups:[], mode:'play' });
    const t=camTarget(); cam.x=t.x; cam.y=t.y; popup(msg, 0, '#bfe3ff', true);
    if(WORLD.bc) popup('ALL POINTS DOUBLED', 0, '#ffe066'); }, 60);
}
// grab a gear pack: ski over it, or just tap / click it on the screen
function takePack(o){
  if(o.takenUntil>game.t || P.packs[o.pack]) return false;
  P.packs[o.pack]=true; o.takenUntil=game.t+30; sfx('chime');
  if(o.pack==='bc') popup('BACKCOUNTRY PACK: SKINS, BEACON, PROBE, SHOVEL', 0, '#bfe3ff', true);
  else popup('PARAGLIDER PACK! '+(TOUCH?'TAP WING':'PRESS V')+' TO OPEN', 0, '#ffe066', true);
  return true;
}
function tapPack(sx,sy){                         // screen point -> nearest pack under it
  if(game.mode!=='play' || !(P.state==='ride' || P.state==='air')) return false;
  const wx=Math.round(cam.x)+sx, wy=Math.round(cam.y)+sy, i0=Math.floor(wy/BUCKET);
  let best=null, bd=1e9;
  for(let ii=i0-1;ii<=i0+1;ii++) for(const o of buckets[ii]||[]) if(o.kind==='pack' && !(o.takenUntil>game.t)){ const d=Math.hypot(wx-o.x,(wy-(o.y-8))*0.7); if(d<16 && d<bd){ bd=d; best=o; } }
  return best ? takePack(best) : false;
}
// ski patrol rescue: the heli flies in, hovers, lowers a stretcher, winches you up and flies you to the base
const HELI_T=[1.6, 3.6, 4.8, 6.0, 7.8];               // wait, fly in, lower, winch up, fly out
function heliPos(){ const H=game.heli, t=H.t, e=u=>u*u*(3-2*u);
  if(!H.sx){ H.sx=P.x+(P.x<WORLD.w/2?280:-280); H.sy=P.y-160; H.ex=P.x-(P.x<WORLD.w/2?-320:320); H.ey=P.y-340; }
  if(t<HELI_T[1] || H.bx===undefined){ H.bx=P.x; H.by=P.y; }               // home in on where you're lying
  if(t<HELI_T[0]) return { x:H.sx, y:H.sy, a:110, rope:0, show:false };
  if(t<HELI_T[1]){ const u=e((t-HELI_T[0])/(HELI_T[1]-HELI_T[0])); return { x:H.sx+(H.bx-H.sx)*u, y:H.sy+(H.by-H.sy)*u, a:110-40*u, rope:0, show:true }; }
  if(t<HELI_T[2]){ const u=(t-HELI_T[1])/(HELI_T[2]-HELI_T[1]); return { x:H.bx, y:H.by, a:70, rope:70*u, show:true }; }
  if(t<HELI_T[3]){ const u=(t-HELI_T[2])/(HELI_T[3]-HELI_T[2]); return { x:H.bx, y:H.by, a:70+20*u, rope:70*(1-u)+20*u, lifted:true, show:true }; }
  const u=e(Math.min(1,(t-HELI_T[3])/(HELI_T[4]-HELI_T[3]))); return { x:H.bx+(H.ex-H.bx)*u, y:H.by+(H.ey-H.by)*u, a:90+60*u, rope:20, lifted:true, show:true };
}
function updHeli(dt){
  const H=game.heli; H.t+=dt;
  if(pressed.enter && H.t>HELI_T[3]) H.t=Math.max(H.t, HELI_T[4]);        // once you're on board, Enter skips the flight out
  const h=heliPos(); H.pos=h;
  if(h.show && h.a<100 && Math.random()<0.8) for(let i=0;i<3;i++){ const a=Math.random()*6.3, r=10+Math.random()*30;   // rotor downwash kicks up snow
    game.parts.push({ x:h.x+Math.cos(a)*r, y:h.y+Math.sin(a)*r*0.5, z:1, vx:Math.cos(a)*90, vy:Math.sin(a)*45, vz:20+Math.random()*30, life:0.5, col:'#ffffff' }); }
  const ty=(h.lifted ? h.y-h.a : P.y)-VH*0.5, tx=clamp((h.lifted?h.x:P.x)-VW/2,0,WORLD.w-VW);
  cam.x+=(tx-cam.x)*Math.min(1,dt*2.5); cam.y+=(ty-cam.y)*Math.min(1,dt*2.5);
  if(H.t>=HELI_T[4]){ const sc=game.score, tm=game.time; game.heli=null; resetSkier(TELE); P.inv=2; P.destroyed=false; P.hp=100; game.score=sc; game.time=tm;
    const t=camTarget(); cam.x=t.x; cam.y=t.y; popup('PATCHED UP BY SKI PATROL', 0, '#bfe3ff', true); }
}
function drawHeli(cx,cy){
  const H=game.heli; if(!H || !H.pos || !H.pos.show) return; const h=H.pos, X=Math.round(h.x-cx), G=Math.round(h.y-cy), Y=G-Math.round(h.a), t=game.t;
  const sc=Math.max(0.4,1-h.a/220); ctx.fillStyle='rgba(40,50,70,0.3)'; ctx.fillRect(Math.round(X-16*sc),G-2,Math.round(32*sc),4);   // shadow on the snow
  const by=Y+10+Math.round(h.rope);
  if(h.rope>0){ ctx.fillStyle='#2a2a2a'; ctx.fillRect(X,Y+9,1,by-Y-9); }                          // winch cable
  if(h.rope>0 || h.lifted){ ctx.fillStyle='#ff7a1a'; ctx.fillRect(X-7,by,15,4); ctx.fillStyle='#c85a10'; ctx.fillRect(X-7,by+3,15,1);   // stretcher basket
    if(h.lifted){ const C=CHARS[game.char]; ctx.fillStyle=C.jacket; ctx.fillRect(X-4,by-1,6,2); ctx.fillStyle=C.helmet; ctx.fillRect(X-6,by-2,3,3); } }
  const d=H.ex<H.bx?-1:1;                                                                           // facing the way out
  ctx.save(); ctx.translate(X,Y); ctx.scale(d,1);
  ctx.fillStyle='#d8282a'; ctx.fillRect(-6,-4,20,10); ctx.fillRect(-4,-6,14,2); ctx.fillRect(12,-2,4,6);   // body
  ctx.fillStyle='#bfe3ff'; ctx.fillRect(12,-3,4,4); ctx.fillStyle='#8fc0e8'; ctx.fillRect(14,-3,2,4);   // windscreen
  ctx.fillStyle='#ffffff'; ctx.fillRect(-4,0,16,2); ctx.fillRect(2,-3,2,6); ctx.fillRect(0,-1,6,2);       // white band and cross
  ctx.fillStyle='#d8282a'; ctx.fillRect(2,-1,2,2);
  ctx.fillStyle='#d8282a'; ctx.fillRect(-20,-2,15,3); ctx.fillRect(-22,-6,3,7);                           // tail boom and fin
  ctx.fillStyle='#ffffff'; ctx.fillRect(-21,-5,1,3);
  const tr=Math.floor(t*30)%2; ctx.fillStyle='rgba(60,60,60,0.7)'; ctx.fillRect(-23,tr?-8:-4,1,tr?7:3);  // tail rotor blur
  ctx.fillStyle='#555'; ctx.fillRect(-4,7,18,1); ctx.fillRect(-2,6,1,2); ctx.fillRect(10,6,1,2);         // skids
  ctx.fillStyle='#333'; ctx.fillRect(3,-9,2,3);                                                          // mast
  const r=Math.floor(t*24)%3, rw=[46,30,40][r]; ctx.fillStyle='rgba(40,40,40,0.75)'; ctx.fillRect(4-rw/2,-10,rw,1);   // main rotor blur
  ctx.fillStyle='rgba(40,40,40,0.25)'; ctx.fillRect(-19,-10,46,1);
  ctx.restore();
  txt('SKI PATROL', X, Y-22, '#ffffff', 6, 'center');
}
// the Niseko road: little kei trucks drive it, the asphalt slows you right down, and jumping it scores a ROAD GAP
function updRoad(dt){
  const R=WORLD.road;
  if(!WORLD.cars){ WORLD.cars=[]; const cols=['#f4f6fa','#2f6fd6','#f4f6fa','#e0402a','#f4f6fa'];
    for(let i=0;i<5;i++) WORLD.cars.push({ x:R.x0+(R.x1-R.x0)*(i+0.3)/5, dir:i%2?-1:1, sp:42+Math.random()*22, col:cols[i] }); }
  for(const c of WORLD.cars){ c.x+=c.dir*c.sp*dt; if(c.x>R.x1) c.x=R.x0; if(c.x<R.x0) c.x=R.x1; }
  const xi=clamp(P.x|0,0,WORLD.w), ry=R.ry[xi], open=R.tun[xi]===0, side=P.y<ry?-1:1;
  if(P.state==='air' && P.roadSide===-1 && side===1 && open && P.z>2){ popup('ROAD GAP!', 200, '#ffe066'); game.score+=200; sfx('tap'); }
  P.roadSide=side;
  if(P.state==='ride' && open && Math.abs(P.y-ry)<10){ P.v*=Math.pow(0.3,dt);                   // asphalt: no glide
    if(!P.onRoad){ P.onRoad=true; popup('ON THE ROAD!', 0, '#bfe3ff'); }
    for(const c of WORLD.cars){ if(R.tun[clamp(c.x|0,0,WORLD.w)]) continue;
      if(Math.abs(P.x-c.x)<10 && Math.abs(P.y-(ry+c.dir*4))<6){ crash('Hit by a kei truck', true); return; } } }
  else P.onRoad=false;
}
// fly between Whistler and Niseko: a little sunset flight over the Pacific, the new mountain builds on take-off
function flyTo(to){
  const from=WORLD.id;
  game.mode='flight'; game.flight={ t:0, dur:6.5, to, from, built:!!MAPS[to], score:game.score, time:game.time };
  P.loadT=0; P.inZone=null; game.jerry.active=false; game.avy=null; sfx('chime');
}
function updFlight(dt){
  const F=game.flight; F.t+=dt;
  if(!F.built && F.t>0.25){ MAPS[F.to] || (MAPS[F.to]=buildMap(DEFS[F.to])); F.built=true; }   // build while the plane climbs out
  if(F.t>=F.dur || (pressed.enter && F.t>1.2 && F.built) || (pressed.jump && F.t>1.2 && F.built)){
    switchMap(F.to); const a=WORLD.air ? WORLD.air.arrive : TELE;
    resetSkier(a); Object.assign(game,{ score:F.score, time:F.time, parts:[], popups:[], mode:'play' });
    const t=camTarget(); cam.x=t.x; cam.y=t.y;
    if(F.to==='niseko'){ popup('ようこそ ニセコへ', 0, '#ffd6a0', true); popup('WELCOME TO NISEKO, JAPAN', 0, '#bfe3ff'); }
    else popup('WELCOME HOME TO WHISTLER', 0, '#bfe3ff', true);
    game.flight=null; }
}
function boardSkinTrack(i){
  const B=WORLD.bc; Object.assign(P,{ state:'skintrack', stS:B.cum[i], v:0, z:0, skins:true, skinAnim:0, loadT:0, stLoad:0, inZone:null });
  popup('ON THE SKIN TRACK', 0, '#bfe3ff'); sfx('chime'); P.tracks.push(null); P.lastTrack=null;
}
function updSkinTrack(dt){                        // zig-zag skin track: like a lift, but you're skinning
  const B=WORLD.bc, T=B.track, C=B.cum, total=C[C.length-1];
  P.stS=Math.min(total, P.stS+CFG.SKINTRACK_SPEED*dt);
  let i=0, lo=0, hi=C.length-1; while(lo<hi){ const m=(lo+hi)>>1; if(C[m]<P.stS) lo=m+1; else hi=m; } i=Math.max(1,lo);
  const a=T[i-1], b=T[i], t=clamp((P.stS-C[i-1])/((C[i]-C[i-1])||1),0,1);
  P.x=a[0]+(b[0]-a[0])*t; P.y=a[1]+(b[1]-a[1])*t; P.h=Math.atan2(b[0]-a[0],b[1]-a[1]); P.v=40; P.z=0;
  if(pressed.jump){ Object.assign(P,{ state:'ride', skins:false, v:0, h:0 }); popup('STEPPED OFF', 0, '#bfe3ff'); return; }
  if(P.stS>=total){ Object.assign(P,{ state:'ride', skins:false, x:START.x, y:START.y, v:0, h:0, inv:1 }); popup('SUMMIT! DROP INTO THE CHAM CHUTES', 0, '#ffe066', true); }
}
function boardTbar(L){
  Object.assign(P,{ state:'tbar', lift:L, liftD:0, tbO:0, tbOV:0, v:0, h:0, z:0, loadT:0, inZone:null });
  popup('GRAB THE T-BAR', 0, '#bfe3ff'); sfx('chime'); P.tracks.push(null); P.lastTrack=null;
}
function updTbar(dt){                             // dragged up on a rope: swing side to side, but only as far as the rope goes
  const L=P.lift, R=CFG.TBAR_ROPE, ux=L.dx/L.len, uy=L.dy/L.len, px=-uy, py=ux;
  P.liftD+=CFG.TBAR_SPEED*dt; const t=Math.min(1,P.liftD/L.len);
  const steer=(keys.right?1:0)-(keys.left?1:0);
  P.tbOV+=steer*170*dt; P.tbOV*=Math.pow(0.25,dt); P.tbO+=P.tbOV*dt;
  const lim=R*0.92; if(Math.abs(P.tbO)>lim){ P.tbO=Math.sign(P.tbO)*lim; P.tbOV*=-0.35; }   // the rope yanks you back
  const back=Math.sqrt(R*R-P.tbO*P.tbO), hx=L.x1+L.dx*t+4, hy=L.y1+L.dy*t;
  P.tbHX=hx; P.tbHY=hy;
  P.x=hx+px*P.tbO-ux*back; P.y=hy+py*P.tbO-uy*back; P.z=0; P.v=60; P.h=clamp(P.tbOV*0.012,-0.7,0.7);
  if(!P.lastTrack || Math.hypot(P.x-P.lastTrack[0],P.y-P.lastTrack[1])>3){
    P.lastTrack=[P.x,P.y,P.h]; P.tracks.push(P.lastTrack); if(P.tracks.length>900) P.tracks.shift(); }
  if(pressed.jump){ Object.assign(P,{ state:'ride', v:0, h:0, lift:null }); popup('LET GO', 0, '#bfe3ff'); P.tracks.push(null); P.lastTrack=null; return; }
  if(t>=1){ Object.assign(P,{ state:'ride', y:P.y+6, v:25, h:0, inv:1, lift:null }); P.tracks.push(null); P.lastTrack=null; }
}
function pipeX(pk,y){ const a=pk.pipe.cx, i=clamp(Math.round((y-pk.y1+20)/4),0,a.length-1); return a[i]; }
function pipeAt(x,y){ for(const pk of PARKS) if(pk.pipe && y>pk.y1 && y<pk.y2){ const dx=x-pipeX(pk,y); if(Math.abs(dx)<pk.pipe.w/2+2) return [pk,dx]; } return null; }
function pipeLift(){                              // how high up the wall you are (just for drawing)
  if(P.state!=='ride') return 0; const q=pipeAt(P.x,P.y); if(!q) return 0;
  const W=q[0].pipe.w/2, F=W*0.5, a=Math.abs(q[1]); if(a<F) return 0; const t=Math.min(1,(a-F)/(W-F)); return Math.round(t*t*16);
}
function catBlocked(x,y){                         // what the snowcat can't drive through
  if(!onMountain(x,y)) return true;
  for(const k of KICKERS) if(Math.abs(x-k.x)<k.w/2+9 && y>k.y-k.len-8 && y<k.y+8) return true;
  for(const c of CLIFFS) if(x>c.x1-6 && x<c.x2+6 && y>c.y-8 && y<c.y+c.h+6) return true;
  for(const q of PONDS) if(q.rect ? (Math.abs(x-q.x)<q.rx+8 && Math.abs(y-q.y)<q.ry+8) : (((x-q.x)/(q.rx+8))**2+((y-q.y)/(q.ry+6))**2<1)) return true;
  const i0=Math.floor(y/BUCKET)-1;
  for(let i=i0;i<=i0+2;i++){ const b=buckets[i]; if(!b) continue;
    for(const o of b){
      if((o.t==='tree' || o.t==='rock' || o.t==='tower') && Math.hypot(x-o.x,y-o.y)<(o.r||4)+6) return true;
      if(o.t==='bldg' && x>o.x-o.w/2-8 && x<o.x+o.w/2+8 && y>o.y-o.h*0.6-6 && y<o.y+6) return true; } }
  return false;
}
function catPoint(c,s){                          // point at distance s along the cat's route
  const p=c.path; let i=0; while(i<p.length-2 && s>c.cum[i+1]) i++;
  const L=c.cum[i+1]-c.cum[i]||1, t=clamp((s-c.cum[i])/L,0,1);
  return [p[i][0]+(p[i+1][0]-p[i][0])*t, p[i][1]+(p[i+1][1]-p[i][1])*t];
}
function boardCat(c){
  if(!c.cum){ c.cum=[0]; for(let i=1;i<c.path.length;i++) c.cum.push(c.cum[i-1]+Math.hypot(c.path[i][0]-c.path[i-1][0], c.path[i][1]-c.path[i-1][1])); }
  if(!c.tracks) c.tracks=[];
  const p0=c.path[0], p1=c.path[Math.min(3,c.path.length-1)];
  Object.assign(P,{ state:'cat', cat:c, catV:0, catH:Math.atan2(p1[0]-p0[0],p1[1]-p0[1]), catI:0, catManual:false, x:c.x, y:c.y, z:0, v:0, h:0, loadT:0, inZone:null });
  popup('CAT RIDE TO THE TOP', 0, '#bfe3ff'); sfx('chime'); P.tracks.push(null); P.lastTrack=null;
}
function updCat(dt){                              // the cat drives itself up its track; press a drive key to take the wheel
  const c=P.cat, pth=c.path, end=pth[pth.length-1];
  if(!P.catManual && (pressed.up || pressed.down || pressed.left || pressed.right)){ P.catManual=true; popup("YOU'RE DRIVING", 0, '#ffe066'); }
  let steer, thr;

// JERRY: a really bad skier with a camcorder taped to his helmet, getting footy for the boys.
// He zig-zags across the whole run. Clear him in the air = Jerry tap. Get near him on the ground and he
// locks on like a heat-seeking missile.
function updJerry(dt){
  const J=game.jerry;
  if(!J.active){
    if((P.state!=='ride' && P.state!=='air') || WORLD.bc) return;     // no Jerry in the backcountry
    game.jerryT-=dt; if(game.jerryT>0) return;
    const e=edgeAt(P.x,P.y);
    if(!(e<0) || !E.r || P.y<WORLD.treeline-600){ game.jerryT=5; return; }   // he only rides the groomers
    const r=E.r, S=r.S; let i=E.i; const want=S[i].s+300;
    while(i<S.length-2 && S[i].s<want) i++;
    if(S.length-i<25){ game.jerryT=8; return; }
    Object.assign(J,{ active:true, r, i, x:S[i].x, y:S[i].y, h:0, phase:Math.random()*6, v:90+Math.random()*25,
      lock:false, down:0, tapped:false, life:70, wob:0 });
    popup('A WILD JERRY APPEARS', 0, '#ffea00'); sfx('jerry'); return;
  }
  const S=J.r.S;
  if(J.down>0){ J.down-=dt; if(J.down<=0){ J.active=false; game.jerryT=CFG.JERRY_EVERY*(0.6+Math.random()*0.8); } return; }
  J.life-=dt;

  const a=S[J.i], c=S[Math.min(J.i+3,S.length-1)], dx=c.x-a.x, dy=c.y-a.y, L=Math.hypot(dx,dy)||1;
  J.phase+=dt*1.7;

  const pd=Math.hypot(P.x-J.x,P.y-J.y), onGround=P.state==='ride' || P.state==='grind';
  if(!J.lock && pd<80 && onGround && P.inv<=0 && P.y>J.y-10){ J.lock=true; popup('JERRY INCOMING!', 0, '#ff6b5a'); }
  if(J.lock){ tx=P.x; ty=Math.max(P.y, J.y+12); if(pd>170 || P.y<J.y-30) J.lock=false; }   // you got above him: he can't skate uphill

  if(Math.random()<dt*0.3) J.wob=0.6; J.wob=Math.max(0,J.wob-dt);   // catches an edge now and then

    if(P.state==='air' && P.z>3){
      if(!J.tapped){ J.tapped=true; popup('JERRY TAP FOR THE BOYS!', 400, '#ffea00'); game.score+=400; P.airBonus=(P.airBonus||0)+400; sfx('tap'); } }
    else if(onGround && P.inv<=0){
      if(P.y<J.y){ if(!J.tapped){ J.tapped=true; popup('JERRY TAP FOR THE BOYS!', 400, '#ffea00'); game.score+=400; P.airBonus=(P.airBonus||0)+400; sfx('tap'); }
        J.down=2.2; J.lock=false; }                                          // you came from behind: he goes down, you ride on

}

  for(const [ox,sx,sy] of lobes){ ctx.fillStyle='#e9f0f8'; pillowDome(mx+ox, base-1, hw*sx-0.5, ht*sy-1, sd+ox*0.013); ctx.fill(); }  // the snow

}

// Japanese-style building: dark timber and white plaster, glowing shoji windows, a deep tiled roof with

function drawJpHouse(o,cx,cy,noDoor){
  const w=o.w, x0=Math.round(o.x-w/2-cx), yb=Math.round(o.y-cy), wallH=Math.max(14,Math.round(o.h*0.62)), ye=yb-wallH, mx=Math.round(x0+w/2);

  ctx.fillStyle='rgba(90,110,145,0.3)'; ctx.fillRect(x0-2,yb,w+4,2);
  ctx.fillStyle='#4a3022'; ctx.fillRect(x0+2,ye,w-4,wallH);                                   // dark timber
  ctx.fillStyle='#efe6d4'; ctx.fillRect(x0+2,ye,w-4,Math.round(wallH*0.38));                  // white plaster band
  ctx.fillStyle='#2e1d14'; for(let px=x0+2; px<=x0+w-3; px+=10) ctx.fillRect(px,ye,1,wallH);   // posts
  ctx.fillRect(x0+2,ye+Math.round(wallH*0.38),w-4,1);
  for(let wx=x0+5; wx<x0+w-10; wx+=10){ if(!noDoor && Math.abs(wx+3-mx)<8) continue;           // shoji windows
    const wy=ye+Math.round(wallH*0.38)+2; ctx.fillStyle='#ffe2a8'; ctx.fillRect(wx,wy,7,5);
    ctx.fillStyle='#8a5a36'; ctx.fillRect(wx+3,wy,1,5); ctx.fillRect(wx,wy+2,7,1); }
  if(!noDoor){ ctx.fillStyle='#2b1a10'; ctx.fillRect(mx-4,yb-8,8,8);                          // door with a noren curtain
    ctx.fillStyle=['#2b3f6b','#7a1f24','#3f5a3a'][sd]; ctx.fillRect(mx-5,yb-9,10,4); ctx.fillStyle='#efe6d4'; ctx.fillRect(mx-1,yb-8,2,2); }
  poly([x0-ov,ye+1, x0+w+ov,ye+1, x0+w-4,ye-roofH, x0+4,ye-roofH], '#2f333d');                // tiled hip roof
  ctx.fillStyle='#2f333d'; ctx.fillRect(x0-ov-1,ye-1,2,2); ctx.fillRect(x0+w+ov-1,ye-1,2,2);    // upturned eave tips
  poly([x0-ov+2,ye-1, x0+w+ov-2,ye-1, x0+w-5,ye-roofH, x0+5,ye-roofH], '#f6f8fb');            // deep snow on the roof
  poly([mx,ye-roofH, x0+w-5,ye-roofH, x0+w+ov-2,ye-1, mx,ye-1], '#dde3ec');

  ctx.fillStyle='#2f333d'; ctx.fillRect(x0-ov,ye-2,w+2*ov,3);                                   // dark tiled eave band
  ctx.fillStyle='#4a505c'; for(let i=0;i<w+2*ov;i+=3) ctx.fillRect(x0-ov+i,ye-2,1,3);
  ctx.fillStyle='#2f333d'; ctx.fillRect(x0-ov-2,ye-4,3,2); ctx.fillRect(x0+w+ov-1,ye-4,3,2);     // eaves curling up at the corners
  ctx.fillStyle='#ffffff'; for(let i=0;i<w+2*ov-4;i+=4) ctx.fillRect(x0-ov+2+i, ye+1, 2, 1+((i*7)%3));   // icicles of snow off the eaves
  for(const lx of [x0+3, x0+w-5]){ const sw=Math.round(Math.sin(game.t*1.7+lx)*0.6);               // red paper lanterns
    ctx.fillStyle='#2e1d14'; ctx.fillRect(lx+1+sw,ye+1,1,2);
    ctx.fillStyle='#d8402f'; ctx.fillRect(lx+sw,ye+3,3,4); ctx.fillStyle='#ffb070'; ctx.fillRect(lx+1+sw,ye+4,1,2);

}
